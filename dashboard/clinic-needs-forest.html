<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="ds/styles.css" />
<title>Forest — Clinic Needs (PLACES × UDS)</title>
<style>
  :root { --accent: var(--signal-600); }
  body { margin:0; background:var(--bg-app); color:var(--text-body); font-family:var(--font-sans); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .wrap { max-width:1440px; margin:0 auto; padding:18px 22px 40px; }
  .hdr { display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  .title h1 { font-size:24px; letter-spacing:-.02em; color:var(--text-strong); margin:0; }
  .title p { font-size:13px; color:var(--text-muted); margin:4px 0 0; max-width:640px; }

  .grid { display:grid; grid-template-columns:1fr 380px; gap:16px; align-items:start; }
  @media (max-width:1080px){ .grid{ grid-template-columns:1fr; } }

  .panel { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
  .panel-h { padding:12px 16px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; gap:10px; }
  .panel-h h3 { font-size:14px; color:var(--text-strong); margin:0; }
  .panel-h .desc { font-size:12px; color:var(--text-muted); margin-left:auto; }
  .panel-body { padding:14px 16px; }
  .mapholder { width:100%; }
  .mapholder svg { width:100%; height:auto; display:block; }

  .backbtn { height:28px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-md);
             background:var(--surface-card); color:var(--text-body); font-size:12.5px; font-weight:600; cursor:pointer; }
  .backbtn:hover { background:var(--surface-sunken); }

  /* Legend */
  .leg-sect { padding:12px 0; border-bottom:1px solid var(--border-subtle); }
  .leg-sect:last-child { border-bottom:none; }
  .leg-sect h4 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin:0 0 8px; }
  .leg-row { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-body); margin:5px 0; }
  .leg-row .sw { width:11px; height:11px; border-radius:50%; flex:none; }
  .leg-note { font-size:11.5px; color:var(--text-muted); line-height:1.5; margin-top:6px; }
  .density { display:flex; gap:10px; margin-top:4px; }
  .density .cell { text-align:center; }
  .density .cell .cap { font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  .needrow { display:flex; align-items:center; gap:10px; padding:7px 6px; border-radius:var(--radius-md); cursor:pointer; }
  .needrow:hover { background:var(--surface-sunken); }
  .needrow .rank { font-size:11px; color:var(--text-muted); width:16px; text-align:right; }
  .needrow .nm { font-size:12.5px; color:var(--text-strong); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .needrow .sc { font-size:12px; font-weight:700; }

  .kv { display:flex; flex-wrap:wrap; gap:14px 22px; margin:2px 0 6px; }
  .kv .k { font-size:11px; color:var(--text-muted); }
  .kv .v { font-size:15px; font-weight:600; color:var(--text-strong); }

  .cliniclist { max-height:150px; overflow:auto; margin-top:6px; }
  .cliniclist .c { display:flex; align-items:center; gap:8px; font-size:12px; padding:4px 2px; border-bottom:1px solid var(--border-subtle); }
  .cliniclist .c:last-child { border-bottom:none; }
  .cliniclist .c .dot { width:8px; height:8px; border-radius:50%; background:var(--signal-600); flex:none; }
  .cliniclist .c .cn { flex:1; color:var(--text-body); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cliniclist .c .cp { color:var(--text-muted); }

  .axis text { fill:var(--slate-500); font-size:10px; font-family:var(--font-mono); }
  .axis path, .axis line { stroke:var(--slate-300); }

  /* Modal */
  .modal-back { position:fixed; inset:0; background:rgba(15,23,42,.42); display:flex; align-items:center; justify-content:center; z-index:80; padding:24px; }
  .modal { width:min(1080px,96vw); max-height:92vh; overflow:auto; background:var(--surface-card); border:1px solid var(--border-subtle);
           border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); }
  .modal-h { padding:16px 20px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; gap:12px; }
  .modal-h h3 { margin:0; font-size:16px; color:var(--text-strong); }
  .modal-h .sw { width:12px; height:12px; border-radius:50%; }
  .modal-h .x { margin-left:auto; border:0; background:none; cursor:pointer; color:var(--text-muted); font-size:18px; }
  .modal-body { padding:14px 18px 22px; }

  .tt { position:fixed; pointer-events:none; opacity:0; transition:opacity 120ms var(--ease-out); background:var(--slate-900); color:#fff;
        font-size:12px; padding:8px 10px; border-radius:var(--radius-md); box-shadow:var(--shadow-lg); max-width:280px; z-index:120; line-height:1.45; }
  .tt b { color:#fff; } .tt .src { color:var(--slate-400); }
  .empty { padding:60px; text-align:center; color:var(--text-muted); }
  .hint { font-size:12px; color:var(--text-muted); line-height:1.5; }
</style>
</head>
<body>
<div id="root"></div>
<div class="tt" id="tt"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script type="text/babel" data-presets="react">
/* =========================================================================
   Clinic Needs Forest — PLACES burden (glyph size) vs UDS response (dot density)
   over a faint Virginia county map.  DUMMY DATA (deterministic, seeded) — swap
   buildDummyData() for a fetch of data/clinic_atlas.json when real grantee /
   clinic-site / UDS data exists.  See dashboard/data/va-counties.geojson.
   ========================================================================= */

/* ---- The four glyph axes (fixed order, 90° apart) ------------------------
   arm length = PLACES burden;  dot density = UDS response (0–100%, "responding
   well" — so dm_poor is INVERTED to a control rate).  CSMOKING is paired with an
   invented UDS `tob_cessation` (no UDS smoking measure exists yet — remap later). */
// `quad` = the 90° arc (d3 radians, 0=top, clockwise) this axis fills — one
// quarter-circle centered on its cardinal direction.
const AXES = [
  { key:"htn", label:"Hypertension", pos:"top",    quad:[-Math.PI/4, Math.PI/4],       places:"BPHIGH",    placesLabel:"High blood pressure",
    udsShort:"HTN controlled", color:"#e34948" },
  { key:"dm",  label:"Diabetes",     pos:"right",  quad:[Math.PI/4, 3*Math.PI/4],      places:"DIABETES",  placesLabel:"Diabetes prevalence",
    udsShort:"Diabetes controlled", color:"#2a78d6" },
  { key:"dep", label:"Depression",   pos:"bottom", quad:[3*Math.PI/4, 5*Math.PI/4],    places:"DEPRESSION",placesLabel:"Depression prevalence",
    udsShort:"Depression screened", color:"#4a3aa7" },
  { key:"smk", label:"Smoking",      pos:"left",   quad:[5*Math.PI/4, 7*Math.PI/4],    places:"CSMOKING",  placesLabel:"Current smoking",
    udsShort:"Tobacco cessation", color:"#eda100" },
];
const AXIS_BY_KEY = Object.fromEntries(AXES.map(a=>[a.key,a]));
const REGIONS = ["Northern","Central","Valley","Southwest","Tidewater"];

const fmt0 = d3.format(".0f"), fmt1 = d3.format(".1f"), fmtC = d3.format(",");
const sgn = d => d>0 ? "+" : "";

/* Shared tooltip (same pattern as the other dashboards) */
const tt = document.getElementById("tt");
const showTT = (html,e) => { tt.innerHTML=html; tt.style.opacity=1; moveTT(e); };
const moveTT = e => { tt.style.left=(e.clientX+14)+"px"; tt.style.top=(e.clientY+14)+"px"; };
const hideTT = () => { tt.style.opacity=0; };

/* Seeded PRNG so the dummy forest is identical on every reload */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const GRANTEE_NAMES = [
  "Blue Ridge Community Health","Tidewater Care Alliance","Shenandoah Valley Health",
  "Central Virginia Health Services","Southwest Mountain Clinics","Piedmont Family Care",
  "Rappahannock Community Health","Eastern Shore Rural Health","Highlands Health Network",
  "James River Health Partners","Roanoke Valley Clinics","Northern Neck Health Coop",
  "Appalachian Care Collective","Chesapeake Bay Health","New River Health Alliance",
  "Old Dominion Family Health","Cumberland Gap Clinics","Peninsula Community Care",
  "Dan River Health Center","Massanutten Health Group",
];
// Anchor each grantee in the region its name implies, so placement reads right.
const GRANTEE_REGION = {
  "Blue Ridge Community Health":"Valley", "Tidewater Care Alliance":"Tidewater",
  "Shenandoah Valley Health":"Valley", "Central Virginia Health Services":"Central",
  "Southwest Mountain Clinics":"Southwest", "Piedmont Family Care":"Central",
  "Rappahannock Community Health":"Northern", "Eastern Shore Rural Health":"Tidewater",
  "Highlands Health Network":"Southwest", "James River Health Partners":"Central",
  "Roanoke Valley Clinics":"Valley", "Northern Neck Health Coop":"Northern",
  "Appalachian Care Collective":"Southwest", "Chesapeake Bay Health":"Tidewater",
  "New River Health Alliance":"Southwest", "Old Dominion Family Health":"Central",
  "Cumberland Gap Clinics":"Southwest", "Peninsula Community Care":"Tidewater",
  "Dan River Health Center":"Central", "Massanutten Health Group":"Valley",
};

/* ---- Dummy data generation (the one place to replace with real data) ----- */
function buildDummyData(geo){
  const rng = mulberry32(20260713);
  const rint = (lo,hi)=> lo + Math.floor(rng()*(hi-lo+1));
  const rf = (lo,hi)=> lo + rng()*(hi-lo);

  // Per-county PLACES prevalence, with mild regional bias so patterns cluster.
  const REG_BIAS = {
    Northern:{BPHIGH:-3,DIABETES:-1,DEPRESSION:0,CSMOKING:-3},
    Central:{BPHIGH:0,DIABETES:0,DEPRESSION:1,CSMOKING:0},
    Valley:{BPHIGH:1,DIABETES:0,DEPRESSION:0,CSMOKING:1},
    Southwest:{BPHIGH:4,DIABETES:3,DEPRESSION:3,CSMOKING:6},
    Tidewater:{BPHIGH:2,DIABETES:2,DEPRESSION:1,CSMOKING:2},
  };
  const counties = {};
  geo.features.forEach(f=>{
    const fips=f.properties.county_fips, reg=f.properties.region;
    const b=REG_BIAS[reg]||REG_BIAS.Central;
    counties[fips]={
      fips, name:f.properties.name, region:reg,
      centroid:d3.geoCentroid(f), bounds:d3.geoBounds(f),
      BPHIGH:  Math.max(20,Math.min(48, 32+b.BPHIGH+rf(-5,5))),
      DIABETES:Math.max(6, Math.min(20, 11+b.DIABETES+rf(-3,3))),
      DEPRESSION:Math.max(12,Math.min(32, 20+b.DEPRESSION+rf(-4,4))),
      CSMOKING:Math.max(7, Math.min(34, 16+b.CSMOKING+rf(-4,4))),
    };
  });
  const fipsList = Object.keys(counties);
  const byRegion = {};
  fipsList.forEach(f=>{ const r=counties[f].region; (byRegion[r]=byRegion[r]||[]).push(f); });

  // Grantees: each anchored in the region its name implies, with 3–6 clinics in
  // nearby counties (which may spill into adjacent regions).
  const grantees = GRANTEE_NAMES.map((name,gi)=>{
    const pool = byRegion[GRANTEE_REGION[name]] || fipsList;
    const home = pool[Math.floor(rng()*pool.length)];
    const hc = counties[home];
    // pick nearby counties by centroid distance for a plausible service area
    const near = fipsList
      .map(fp=>({fp,d:d3.geoDistance(hc.centroid,counties[fp].centroid)}))
      .sort((a,b)=>a.d-b.d).slice(0, rint(6,11)).map(o=>o.fp);
    const nClin = rint(3,6);
    const clinics = [];
    for(let i=0;i<nClin;i++){
      const cf = near[Math.floor(rng()*near.length)];
      const co = counties[cf];
      const [[w,s],[e,n]] = co.bounds;
      // jitter within ~40% of the county bbox around its centroid
      const lng = co.centroid[0] + (rng()-0.5)*(e-w)*0.4;
      const lat = co.centroid[1] + (rng()-0.5)*(n-s)*0.4;
      clinics.push({ id:`g${gi}c${i}`, name:`${co.name} ${["Health Center","Clinic","Family Care","Community Site"][i%4]}`,
        county_fips:cf, countyName:co.name, region:co.region, lat, lng, patients:rint(900,7200) });
    }
    const cCounties = Array.from(new Set(clinics.map(c=>c.county_fips)));
    const cRegions = Array.from(new Set(clinics.map(c=>c.region)));
    const totPat = d3.sum(clinics,c=>c.patients);

    // grantee PLACES burden = patient-weighted mean over its clinic counties
    const places={};
    ["BPHIGH","DIABETES","DEPRESSION","CSMOKING"].forEach(k=>{
      places[k] = d3.sum(clinics,c=>counties[c.county_fips][k]*c.patients)/totPat;
    });

    // UDS response measures (dummy). Independent of burden -> real spread of
    // "in need" (low response) vs "responding" (high response) glyphs.
    const uds = {
      htn_control: rf(48,90),
      dm_poor:     rf(10,42),          // higher = worse -> inverted below
      depr_screen: rf(40,92),
      tob_cessation: rf(38,88),
      patient_count: totPat,
    };
    rng();  // keep the seeded layout identical across edits (placeholder for a per-grantee draw)
    return { id:`G${gi}`, name, clinics, counties:cCounties, regions:cRegions, places, uds,
             centroid:[ d3.mean(clinics,c=>c.lng), d3.mean(clinics,c=>c.lat) ] };
  });

  // Per-axis convenience values + normalization across grantees.
  const placesByAxis = ax => grantees.map(g=>g.places[ax.places]);
  const udsPctOf = (g,axKey)=>{
    if(axKey==="htn") return g.uds.htn_control;
    if(axKey==="dm")  return 100 - g.uds.dm_poor;   // poor control -> control rate
    if(axKey==="dep") return g.uds.depr_screen;
    return g.uds.tob_cessation;
  };
  const burdenScale = {};
  AXES.forEach(ax=>{ const v=placesByAxis(ax); burdenScale[ax.key]=d3.scaleLinear().domain([d3.min(v),d3.max(v)]).range([0,1]).clamp(true); });

  grantees.forEach(g=>{
    g.placesByAxis={}; g.respPct={}; g.burdenNorm={};
    AXES.forEach(ax=>{
      g.placesByAxis[ax.key]=g.places[ax.places];
      g.respPct[ax.key]=udsPctOf(g,ax.key);
      g.burdenNorm[ax.key]=burdenScale[ax.key](g.places[ax.places]);
    });
    g.meanBurden = d3.mean(AXES,ax=>g.burdenNorm[ax.key]);
    g.meanResp   = d3.mean(AXES,ax=>g.respPct[ax.key])/100;
    // need = high burden AND low response
    g.needScore  = g.meanBurden*(1-g.meanResp);
  });
  return { counties, grantees, geo };
}

/* ---- Glyph renderer (shared: small on map, large in pop-out) --------------
   Four wedges, one per indicator, meeting edge-to-edge (no gaps). A wedge's
   OUTER RADIUS = PLACES burden (how far OUT it reaches). Its ANGULAR WIDTH =
   unmet need: it fills its whole 90° quarter when response is 0, and narrows to
   a thin sliver as UDS response rises — the more controlled, the less you see.
   So a big full quarter = high burden, low response = most in need. */
function outerFor(R, bN){ return R*(0.16 + 0.84*bN); }         // burden -> outer radius
const lighten = (c,t)=> d3.interpolateRgb(c, "#ffffff")(t);    // lighter tint of an axis color
const MIN_HALF = 0.05;                                          // sliver still visible at 100% response
function drawGlyph(g, gr, opts){
  const { R, interactive=false, showRing=false } = opts;
  g.selectAll("*").remove();
  const sw = Math.max(0.8, R*0.03);
  if(showRing) g.append("circle").attr("r",R).attr("fill","none").attr("stroke","var(--slate-300)")
    .attr("stroke-dasharray","2 3").attr("opacity",0.5);

  AXES.forEach(ax=>{
    const outerR = outerFor(R, gr.burdenNorm[ax.key]);           // burden
    const respF  = Math.max(0, Math.min(1, gr.respPct[ax.key]/100));
    const center = (ax.quad[0]+ax.quad[1])/2;
    const half   = Math.max(MIN_HALF, (Math.PI/4)*(1-respF));    // response narrows the wedge
    g.append("path").attr("d", d3.arc().innerRadius(0).outerRadius(outerR)
        .startAngle(center-half).endAngle(center+half).cornerRadius(R*0.13)())
      .attr("fill",lighten(ax.color,0.62)).attr("stroke",ax.color).attr("stroke-width",sw).attr("stroke-linejoin","round");
    if(interactive){
      // hover target spans the whole quarter so thin slivers stay easy to hit
      g.append("path").attr("d", d3.arc().innerRadius(0).outerRadius(R).startAngle(ax.quad[0]).endAngle(ax.quad[1])())
        .attr("fill","transparent").style("cursor","help")
        .on("mouseover",e=>showTT(
          `<b>${ax.label}</b>`+
          `<br>PLACES burden — ${ax.placesLabel}: <b>${fmt1(gr.placesByAxis[ax.key])}%</b>`+
          `<br>UDS response — ${ax.udsShort}: <b>${fmt1(gr.respPct[ax.key])}%</b>`+
          `<br><span class="src">outward = burden · width = unmet need (narrow = controlled)</span>`, e))
        .on("mousemove",moveTT).on("mouseout",hideTT);
    }
  });
}

/* Small React wrapper that renders a single glyph into an inline SVG. */
function GlyphBox({ gr, R, interactive, showRing=true, pad=14 }){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const S=(R+pad)*2, host=d3.select(ref.current).html("");
    const svg=host.append("svg").attr("viewBox",`0 0 ${S} ${S}`).attr("width",S).attr("height",S)
      .attr("role","img").attr("aria-label",`Glyph for ${gr?gr.name:"sample"}`);
    if(gr) drawGlyph(svg.append("g").attr("transform",`translate(${S/2},${S/2})`), gr, {R,interactive,showRing});
  });
  return <div ref={ref} />;
}
// synthetic grantee for legend examples
function sampleGlyph(bn, rf){
  const o={burdenNorm:{},respPct:{},placesByAxis:{}};
  AXES.forEach(a=>{ o.burdenNorm[a.key]=bn; o.respPct[a.key]=rf*100; o.placesByAxis[a.key]=0; });
  return o;
}

/* ---- Dual-sided (top/bottom) bar chart — shared by both drill-downs ------- */
function drawDualBar(el, { rows, colorTop, colorBottom, topLabel, botLabel, note }){
  const host=d3.select(el).html("");
  const n=rows.length, col=Math.max(40, Math.min(74, 620/n)), bw=Math.min(30,col*0.54);
  const m={ top:30, bottom:110, left:52, right:14 }, half=118, cy=m.top+half;
  const W=m.left+n*col+m.right, H=cy+half+m.bottom;
  const v=d3.scaleLinear().domain([0,100]).range([0,half]);
  const svg=host.append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%")
    .attr("role","img").attr("aria-label","Dual-sided bar chart: UDS response above, PLACES burden below.");

  // gridlines + % ticks for both halves (shared 0–100 magnitude)
  [0,50,100].forEach(t=>{
    [cy-v(t),cy+v(t)].forEach((yy,idx)=>{
      if(t===0 && idx===1) return;
      svg.append("line").attr("x1",m.left).attr("x2",W-m.right).attr("y1",yy).attr("y2",yy)
        .attr("stroke","var(--slate-200)").attr("stroke-width",t===0?0:1).attr("opacity",.9);
      svg.append("text").attr("x",m.left-8).attr("y",yy+3).attr("text-anchor","end")
        .attr("font-size",9.5).attr("font-family","var(--font-mono)").attr("fill","var(--slate-400)").text(t+"%");
    });
  });
  svg.append("line").attr("x1",m.left-2).attr("x2",W-m.right).attr("y1",cy).attr("y2",cy).attr("stroke","var(--slate-400)").attr("stroke-width",1);
  svg.append("text").attr("x",m.left-46).attr("y",cy-half/2).attr("transform",`rotate(-90 ${m.left-46} ${cy-half/2})`)
    .attr("text-anchor","middle").attr("font-size",10).attr("fill","var(--slate-500)").text("UDS response");
  svg.append("text").attr("x",m.left-46).attr("y",cy+half/2).attr("transform",`rotate(-90 ${m.left-46} ${cy+half/2})`)
    .attr("text-anchor","middle").attr("font-size",10).attr("fill","var(--slate-500)").text("PLACES burden");

  rows.forEach((row,i)=>{
    const x=m.left+i*col+col/2, ct=colorTop(row,i), cb=colorBottom(row,i);
    const grp=svg.append("g").style("cursor","default")
      .on("mouseover",e=>showTT(
        `<b>${row.label}</b>`+
        `<br>UDS ${row.udsShort||"response"}: <b>${fmt1(row.top)}%</b>`+
        `<br>PLACES ${row.placesShort||"burden"}: <b>${fmt1(row.bottom)}%</b>`+
        `<br><b>Δ UDS−PLACES: ${sgn(row.gap)}${fmt1(row.gap)} pts</b>`, e))
      .on("mousemove",moveTT).on("mouseout",hideTT);
    grp.append("rect").attr("x",x-bw/2).attr("y",cy-1-v(row.top)).attr("width",bw).attr("height",v(row.top)).attr("rx",3).attr("fill",ct).attr("fill-opacity",0.95);
    grp.append("rect").attr("x",x-bw/2).attr("y",cy+1).attr("width",bw).attr("height",v(row.bottom)).attr("rx",3).attr("fill",cb).attr("fill-opacity",0.62);
    // gap label above the top bar
    svg.append("text").attr("x",x).attr("y",cy-3-v(row.top)-4).attr("text-anchor","middle")
      .attr("font-size",10).attr("font-weight",700).attr("font-family","var(--font-mono)").attr("fill","var(--slate-600)")
      .text(sgn(row.gap)+fmt0(row.gap));
    // column label (rotated)
    const nm=row.label.length>18?row.label.slice(0,17)+"…":row.label;
    svg.append("text").attr("x",x).attr("y",cy+half+14).attr("transform",`rotate(38 ${x} ${cy+half+14})`)
      .attr("text-anchor","start").attr("font-size",10.5).attr("fill","var(--slate-600)").text(nm);
  });

  // legend
  const lg=svg.append("g").attr("transform",`translate(${m.left},14)`);
  lg.append("rect").attr("width",11).attr("height",11).attr("rx",2).attr("fill",typeof rows[0]!=="undefined"?colorTop(rows[0],0):"#2a78d6").attr("fill-opacity",.95);
  lg.append("text").attr("x",16).attr("y",10).attr("font-size",11).attr("fill","var(--slate-600)").text(topLabel+" (top)");
  const lg2=svg.append("g").attr("transform",`translate(${m.left+150},14)`);
  lg2.append("rect").attr("width",11).attr("height",11).attr("rx",2).attr("fill",typeof rows[0]!=="undefined"?colorBottom(rows[0],0):"#e34948").attr("fill-opacity",.62);
  lg2.append("text").attr("x",16).attr("y",10).attr("font-size",11).attr("fill","var(--slate-600)").text(botLabel+" (bottom)");
  if(note) svg.append("text").attr("x",W-m.right).attr("y",14).attr("text-anchor","end").attr("font-size",10.5).attr("fill","var(--slate-400)").text(note);
}
function DualBar(props){
  const ref=React.useRef(null);
  React.useEffect(()=>{ if(props.rows.length) drawDualBar(ref.current, props); });
  return <div ref={ref} />;
}

/* ---- The map: faint counties + glyph forest + clinic dots + zoom --------- */
function buildMap(host, data, onSelect){
  const W=880, H=430;
  const svg=d3.select(host).html("").append("svg").attr("viewBox",`0 0 ${W} ${H}`)
    .attr("role","img").attr("aria-label","Virginia map with a forest of clinic-need glyphs.");
  const projection=d3.geoConicConformal().parallels([37.5,39.5]).rotate([79,0]).fitExtent([[16,16],[W-16,H-16]],data.geo);
  const path=d3.geoPath(projection);

  const gZoom=svg.append("g");                 // zoomed layer: counties + clinics
  gZoom.append("g").selectAll("path").data(data.geo.features).join("path")
    .attr("d",path).attr("fill","none").attr("stroke","var(--slate-300)").attr("stroke-width",0.7)
    .attr("vector-effect","non-scaling-stroke");
  const clinicG=gZoom.append("g");
  const gGlyphs=svg.append("g");               // screen-space forest (not zoomed)

  // Fixed reference radius so wedge extents are comparable glyph-to-glyph; each
  // glyph's visual size emerges from its per-axis burdens. Collide by the actual
  // largest wedge so low-burden glyphs aren't over-spaced.
  const FR=24;
  const nodes=data.grantees.map(g=>{
    const p=projection(g.centroid);
    const outerMax=outerFor(FR, d3.max(AXES,a=>g.burdenNorm[a.key]));
    return { g, R:FR, collide:outerMax+3, px:p[0], py:p[1], x:p[0], y:p[1] };
  });
  const sim=d3.forceSimulation(nodes)
    .force("x",d3.forceX(d=>d.px).strength(0.6)).force("y",d3.forceY(d=>d.py).strength(0.6))
    .force("collide",d3.forceCollide(d=>d.collide).strength(0.9)).stop();
  for(let i=0;i<160;i++) sim.tick();

  const glyphSel=gGlyphs.selectAll("g.glyph").data(nodes,d=>d.g.id).join("g").attr("class","glyph")
    .attr("transform",d=>`translate(${d.x},${d.y})`).style("cursor","pointer")
    .on("mouseover",(e,d)=>showTT(`<b>${d.g.name}</b><br>${d.g.clinics.length} clinics · ${d.g.regions.join(", ")}`+
        `<br>burden ${fmt0(d.g.meanBurden*100)} · response ${fmt0(d.g.meanResp*100)}%`+
        `<br><span class="src">click to open</span>`,e))
    .on("mousemove",moveTT).on("mouseout",hideTT).on("click",(e,d)=>onSelect(d.g.id));
  glyphSel.each(function(d){
    // connector to the true centroid if the node was nudged by collision
    if(Math.hypot(d.x-d.px,d.y-d.py)>3){
      d3.select(this.parentNode).insert("line",":first-child")
        .attr("x1",d.x).attr("y1",d.y).attr("x2",d.px).attr("y2",d.py)
        .attr("stroke","var(--slate-300)").attr("stroke-width",0.6);
    }
    drawGlyph(d3.select(this).append("g"), d.g, { R:d.R });
    d3.select(this).append("circle").attr("r",d.collide).attr("fill","transparent"); // hit target
  });

  const zoom=d3.zoom().scaleExtent([1,12]).on("zoom",ev=>{
    gZoom.attr("transform",ev.transform);
    clinicG.selectAll("circle").attr("r",5/ev.transform.k).attr("stroke-width",1.5/ev.transform.k);
  });
  svg.call(zoom).on("wheel.zoom",null).on("mousedown.zoom",null).on("dblclick.zoom",null).on("touchstart.zoom",null);

  function update(mode, selId){
    if(mode==="grantee" && selId){
      const g=data.grantees.find(x=>x.id===selId);
      gGlyphs.transition().duration(350).style("opacity",0).style("pointer-events","none");
      const P=g.clinics.map(c=>projection([c.lng,c.lat]));
      const x0=d3.min(P,p=>p[0]), x1=d3.max(P,p=>p[0]), y0=d3.min(P,p=>p[1]), y1=d3.max(P,p=>p[1]);
      const bw=Math.max(x1-x0,30), bh=Math.max(y1-y0,30);
      const k=Math.min(9, 0.72*Math.min(W/bw,H/bh));
      const t=d3.zoomIdentity.translate(W/2-k*(x0+x1)/2, H/2-k*(y0+y1)/2).scale(k);
      svg.transition().duration(750).call(zoom.transform,t);
      const dots=clinicG.selectAll("circle").data(g.clinics,c=>c.id);
      dots.join("circle").attr("cx",c=>projection([c.lng,c.lat])[0]).attr("cy",c=>projection([c.lng,c.lat])[1])
        .attr("r",5/k).attr("fill","var(--signal-600)").attr("stroke","#fff").attr("stroke-width",1.5/k).style("cursor","pointer")
        .on("mouseover",(e,c)=>showTT(`<b>${c.name}</b><br>${c.countyName} County · ${c.region}<br>${fmtC(c.patients)} patients`,e))
        .on("mousemove",moveTT).on("mouseout",hideTT);
    } else {
      gGlyphs.transition().duration(350).style("opacity",1).style("pointer-events","auto");
      clinicG.selectAll("circle").remove();
      svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity);
    }
  }
  return { update };
}
function MapPanel({ data, mode, selectedId, onSelect }){
  const ref=React.useRef(null), api=React.useRef(null);
  React.useEffect(()=>{ if(data){ api.current=buildMap(ref.current,data,onSelect); } },[data]);
  React.useEffect(()=>{ if(api.current) api.current.update(mode,selectedId); },[mode,selectedId,data]);
  return <div ref={ref} className="mapholder" />;
}

/* ---- Legend (decodes the whole glyph; always visible in forest mode) ------ */
function ResponseRamp(){
  // one quarter at fixed burden; response narrows the wedge: 25% / 55% / 90%
  const S=54, R=24, C="#0284c7", full=d3.arc().innerRadius(0).outerRadius(R).startAngle(-Math.PI/4).endAngle(Math.PI/4)();
  const wedge=half=>d3.arc().innerRadius(0).outerRadius(R).startAngle(-half).endAngle(half).cornerRadius(R*0.13)();
  return (
    <div className="density">
      {[0.25,0.55,0.9].map((rf,i)=>{
        const half=Math.max(0.05,(Math.PI/4)*(1-rf));
        return (
          <div className="cell" key={i}>
            <svg width={S} height={S} viewBox={`0 0 ${S} ${S}`}><g transform={`translate(${S/2},${S/2})`}>
              <path d={full} fill={C} fillOpacity="0.1"/>
              <path d={wedge(half)} fill={lighten(C,0.62)} stroke={C} strokeWidth="1.4" strokeLinejoin="round"/>
            </g></svg>
            <div className="cap">{Math.round(rf*100)}%</div>
          </div>
        );
      })}
    </div>
  );
}
function Legend({ sample }){
  const examples=[
    { g:sampleGlyph(0.92,0.15), t:"most in need", d:"big, full quarters" },
    { g:sampleGlyph(0.92,0.90), t:"responding",   d:"long, thin slivers" },
    { g:sampleGlyph(0.30,0.5),  t:"low burden",   d:"small" },
  ];
  return (
    <div>
      <div className="leg-sect">
        <h4>Anatomy of a glyph</h4>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          {sample && <GlyphBox gr={sample} R={52} interactive pad={10} />}
          <div className="leg-note" style={{margin:0}}>
            Each glyph is four <b>wedges</b>, one per indicator. A wedge reaches
            <b> outward as far as the PLACES community burden</b>. Its <b>width shrinks as UDS
            response rises</b> — an unmet measure fills its whole quarter; a well-controlled one
            narrows to a thin sliver. The more controlled, the less you see.
          </div>
        </div>
      </div>
      <div className="leg-sect">
        <h4>Quarters (position &amp; color)</h4>
        {AXES.map(ax=>(
          <div className="leg-row" key={ax.key}>
            <span className="sw" style={{background:ax.color}} />
            <span style={{width:96}}>{ax.label} <span style={{color:"var(--text-muted)"}}>({ax.pos})</span></span>
            <span style={{color:"var(--text-muted)",fontSize:11.5}}>PLACES {ax.places} · UDS {ax.udsShort}</span>
          </div>
        ))}
      </div>
      <div className="leg-sect">
        <h4>Wedge width = UDS response</h4>
        <ResponseRamp />
        <div className="leg-note">A narrower wedge = better response (more controlled). Polarity is
          unified to “responding well”, so diabetes uses control rate (<b>100 − dm_poor</b>).</div>
      </div>
      <div className="leg-sect">
        <h4>Reading the glyphs</h4>
        <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
          {examples.map((ex,i)=>(
            <div key={i} style={{textAlign:"center",flex:1}}>
              <GlyphBox gr={ex.g} R={40} pad={8} />
              <div style={{fontSize:11.5,fontWeight:600,color:"var(--text-strong)"}}>{ex.t}</div>
              <div style={{fontSize:10.5,color:"var(--text-muted)"}}>{ex.d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---- Forest-mode side panel: legend + "most in need" ranking -------------- */
function ForestSide({ data, onSelect }){
  const ranked=data.grantees.slice().sort((a,b)=>b.needScore-a.needScore);
  const sample=ranked[Math.floor(ranked.length/2)];
  const col=d3.scaleLinear().domain([d3.min(data.grantees,g=>g.needScore),d3.max(data.grantees,g=>g.needScore)])
    .range(["#0284c7","#dc2626"]).interpolate(d3.interpolateLab).clamp(true);
  return (
    <React.Fragment>
      <div className="panel">
        <div className="panel-h"><h3>Legend</h3><span className="desc">how to read a glyph</span></div>
        <div className="panel-body" style={{paddingTop:4}}><Legend sample={sample} /></div>
      </div>
      <div className="panel" style={{marginTop:16}}>
        <div className="panel-h"><h3>Most in need</h3><span className="desc">burden × (1 − response)</span></div>
        <div className="panel-body" style={{paddingTop:6}}>
          {ranked.slice(0,8).map((g,i)=>(
            <div className="needrow" key={g.id} onClick={()=>onSelect(g.id)}>
              <span className="rank">{i+1}</span><span className="nm">{g.name}</span>
              <span className="sc" style={{color:col(g.needScore)}}>{fmt0(g.needScore*100)}</span>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---- Grantee-mode side panel: pop-out glyph + dual bar + clinic list ------ */
function GranteeSide({ g, onBack }){
  const rows=AXES.map(ax=>({
    key:ax.key, label:ax.label, color:ax.color,
    top:g.respPct[ax.key], bottom:g.placesByAxis[ax.key], gap:g.respPct[ax.key]-g.placesByAxis[ax.key],
    udsShort:ax.udsShort, placesShort:ax.placesLabel,
  })).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  return (
    <div className="panel">
      <div className="panel-h"><h3>{g.name}</h3><button className="backbtn" style={{marginLeft:"auto"}} onClick={onBack}>← Forest</button></div>
      <div className="panel-body">
        <div style={{display:"flex",justifyContent:"center"}}><GlyphBox gr={g} R={108} interactive pad={18} /></div>
        <div className="kv" style={{justifyContent:"center",marginTop:2}}>
          <div><div className="k">Clinics</div><div className="v mono">{g.clinics.length}</div></div>
          <div><div className="k">Patients</div><div className="v mono">{fmtC(Math.round(g.uds.patient_count))}</div></div>
          <div><div className="k">Counties</div><div className="v mono">{g.counties.length}</div></div>
          <div><div className="k">Regions</div><div className="v">{g.regions.length}</div></div>
        </div>
        <div style={{fontSize:11.5,color:"var(--text-muted)",margin:"8px 0 2px"}}>UDS response vs PLACES burden — sorted by |gap|</div>
        <DualBar rows={rows} topLabel="UDS response" botLabel="PLACES burden"
          colorTop={r=>r.color} colorBottom={r=>r.color} note="hover a bar for values" />
        <div style={{fontSize:11.5,color:"var(--text-muted)",margin:"6px 0 2px"}}>Clinics <span className="hint">(highlighted on the map — hover a dot)</span></div>
        <div className="cliniclist">
          {g.clinics.map(c=>(
            <div className="c" key={c.id}><span className="dot" /><span className="cn">{c.name}</span><span className="cp mono">{fmtC(c.patients)}</span></div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---- App ------------------------------------------------------------------ */
function App(){
  const [data,setData]=React.useState(null);
  const [err,setErr]=React.useState(null);
  const [selectedId,setSelectedId]=React.useState(null);

  React.useEffect(()=>{
    fetch("data/va-counties.geojson").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(geo=>setData(buildDummyData(geo)))
      .catch(e=>setErr("Could not load data/va-counties.geojson ("+e.message+")."));
  },[]);

  const mode=selectedId?"grantee":"forest";
  const g=data&&selectedId?data.grantees.find(x=>x.id===selectedId):null;

  if(err) return <div className="empty">{err}</div>;
  if(!data) return <div className="empty">Loading forest…</div>;

  return (
    <div className="wrap">
      <div className="hdr">
        <div className="title">
          <h1>Clinic Needs Forest</h1>
          <p>Virginia — each glyph is a grantee, drawn as four wedges. A wedge reaches
             <b> outward with PLACES community burden</b> and <b>narrows as UDS clinic response rises</b>
             (controlled = a thin sliver). Big, full quarters = most in need. Click a glyph to drill in.
             <span style={{color:"var(--violet-600)"}}> Dummy data.</span></p>
        </div>
      </div>

      <div className="grid">
        <section className="panel">
          <div className="panel-h">
            <h3>{mode==="grantee"?g.name:"Virginia — grantee forest"}</h3>
            <span className="desc">{mode==="grantee"?`${g.clinics.length} clinics highlighted · zoomed`:`${data.grantees.length} grantees`}</span>
            {mode==="grantee" && <button className="backbtn" style={{marginLeft:10}} onClick={()=>setSelectedId(null)}>← Back to forest</button>}
          </div>
          <div className="panel-body" style={{padding:8}}>
            <MapPanel data={data} mode={mode} selectedId={selectedId} onSelect={setSelectedId} />
          </div>
        </section>

        <aside>
          {mode==="grantee"
            ? <GranteeSide g={g} onBack={()=>setSelectedId(null)} />
            : <ForestSide data={data} onSelect={setSelectedId} />}
        </aside>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

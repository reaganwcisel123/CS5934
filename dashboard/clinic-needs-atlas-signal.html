<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="ds/styles.css" />
<title>Signal — Clinic Needs Atlas</title>
<style>
  :root {
    --ink: var(--text-strong); --muted: var(--text-muted); --line: var(--border-subtle);
    --accent: var(--signal-600);
  }
  body { margin: 0; background: var(--bg-app); color: var(--text-body); font-family: var(--font-sans); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .app { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--slate-900); color: var(--slate-300); display:flex; flex-direction:column; padding:16px 12px; gap:6px; }
  .side .wordmark { display:flex; align-items:center; gap:9px; color:#fff; font-weight:700; font-size:15px; padding:6px 8px 14px; }
  .side .wordmark .mark { width:24px; height:24px; border-radius:6px; background:var(--brand); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .prod-switch { display:flex; flex-direction:column; gap:4px; padding:6px 4px 12px; }
  .prod-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-md); font-size:14px; font-weight:600; color:var(--slate-300); transition:var(--transition-control); }
  .prod-item.on { background:rgba(255,255,255,.10); color:#fff; }
  .side-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--slate-500); padding:8px 10px 4px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-md); font-size:14px; color:var(--slate-300); cursor:pointer; transition:var(--transition-control); }
  .nav-item:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.on { background:var(--signal-600); color:#fff; }
  .side-foot { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border-top:1px solid rgba(255,255,255,.08); }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--signal-500); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }

  /* Main */
  .main { display:flex; flex-direction:column; min-width:0; }
  .topbar { height:60px; display:flex; align-items:center; gap:14px; padding:0 24px; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--border-subtle); position:sticky; top:0; z-index:10; }
  .crumb { font-size:13px; color:var(--text-muted); }
  .county-select { height:34px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-strong); font-family:var(--font-sans); font-size:13px; }
  .county-select:focus { outline:none; box-shadow:var(--ring-focus); border-color:var(--border-focus); }
  .county-combo { position:relative; margin-left:8px; }
  .county-combo .county-select { width:100%; box-sizing:border-box; }
  .county-menu { position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:280px; overflow-y:auto; background:var(--surface-raised); border:1px solid var(--border-default); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); z-index:20; padding:4px; }
  .county-opt { padding:7px 10px; border-radius:var(--radius-sm); font-size:13px; color:var(--text-strong); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .county-opt:hover, .county-opt.active { background:var(--signal-600); color:#fff; }
  .county-opt .region { color:var(--text-muted); font-size:12px; }
  .county-opt:hover .region, .county-opt.active .region { color:rgba(255,255,255,.82); }
  .county-empty { padding:10px; font-size:13px; color:var(--text-muted); }
  .content { padding:24px; display:flex; flex-direction:column; gap:16px; }
  .page-head h1 { font-size:26px; letter-spacing:-.02em; color:var(--text-strong); margin:0; }
  .page-head p { color:var(--text-muted); font-size:14px; margin:4px 0 0; max-width:760px; }
  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .stat-cell { display:flex; min-width:0; }
  .stat-cell > * { flex:1; min-width:0; }

  /* First-run intro banner (dismissible) */
  .intro { display:flex; gap:14px; align-items:flex-start; background:var(--surface-sunken); border:1px solid var(--border-default); border-left:3px solid var(--signal-600); border-radius:var(--radius-lg); padding:14px 16px; }
  .intro .ico { flex:none; margin-top:1px; }
  .intro h4 { margin:0 0 3px; font-size:14px; color:var(--text-strong); }
  .intro p { margin:0; font-size:13px; color:var(--text-body); line-height:1.5; }
  .intro .dismiss { flex:none; margin-left:auto; height:28px; padding:0 12px; border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-body); font-family:var(--font-sans); font-size:12px; cursor:pointer; transition:var(--transition-control); }
  .intro .dismiss:hover { background:var(--surface-sunken); }

  .two-col { display:grid; grid-template-columns:1.25fr 1fr; gap:16px; align-items:start; }
  .triage-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:16px; align-items:start; }
  @media (max-width: 1120px){ .two-col, .triage-grid{ grid-template-columns:1fr; } .stat-grid{ grid-template-columns:repeat(2,1fr);} }

  .panel { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
  .panel-h { padding:14px 18px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; gap:8px; }
  .panel-h h3 { font-size:15px; color:var(--text-strong); margin:0; }
  .panel-h .desc { font-size:12px; color:var(--text-muted); margin-left:auto; }
  .panel-body { padding:16px 18px; }
  .heat-scroll { max-height:560px; overflow:auto; }

  /* At-risk patients (model risk tiers + drivers, US-019/020) */
  .risk-table { width:100%; border-collapse:collapse; font-size:13px; }
  .risk-table th { text-align:left; font-size:11px; font-weight:600; color:var(--text-muted); padding:0 8px 6px; border-bottom:1px solid var(--border-subtle); }
  .risk-table td { padding:8px; border-bottom:1px solid var(--border-subtle); color:var(--text-body); vertical-align:top; }
  .risk-table tr:last-child td { border-bottom:none; }
  .risk-sub { color:var(--text-muted); font-size:12px; }
  .risk-tier { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:var(--radius-pill); border:1px solid; }
  .risk-chip { display:inline-block; font-size:11px; color:var(--text-body); background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-pill); padding:2px 7px; margin:0 4px 4px 0; }
  .risk-note { margin:10px 0 0; font-size:11.5px; color:var(--text-muted); }
  /* Prominent county model-risk card (US-019/020) */
  .county-risk { display:flex; align-items:center; gap:26px; flex-wrap:wrap; background:var(--surface-card); border:1px solid var(--border-subtle); border-left:4px solid var(--signal-600); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:16px 20px; margin:14px 0 4px; }
  .county-risk.high { border-left-color:var(--danger-500); }
  .county-risk .cr-label { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
  .county-risk .cr-scorerow { display:flex; align-items:center; gap:12px; margin:6px 0 4px; }
  .county-risk .cr-score { font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1; color:var(--text-strong); }
  .county-risk .cr-sub { font-size:12px; color:var(--text-muted); max-width:340px; }
  .county-risk .cr-why { flex:1; min-width:220px; }
  .county-risk .cr-why-h { font-size:12px; font-weight:600; color:var(--text-body); margin:0 0 7px; }

  .seg { display:inline-flex; border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }
  .seg button { border:0; background:var(--surface-card); color:var(--text-body); font-family:var(--font-sans); font-size:13px; padding:6px 12px; cursor:pointer; transition:var(--transition-control); }
  .seg button.on { background:var(--signal-600); color:#fff; }
  .tabwrap { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:4px 16px; }

  .prov { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .prov .lbl { font-size:12px; color:var(--text-muted); margin-right:2px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:3px 9px; border-radius:var(--radius-pill); border:1px solid; background:var(--surface-card); }
  .pill .dot { width:7px; height:7px; border-radius:50%; }

  /* Legend row: provenance pills + the diverging color key */
  .legend-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .divlegend { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .divlegend b { font-weight:600; }
  .divlegend .scale { width:110px; height:8px; border-radius:var(--radius-pill); background:linear-gradient(90deg,#0284c7,#e2e8f0,#dc2626); }

  /* Responsive: collapse the sidebar and stack on narrow screens. */
  @media (max-width: 860px){
    .app { grid-template-columns: 1fr; }
    .side { display:none; }
    .topbar { height:auto; flex-wrap:wrap; padding:10px 16px; }
    .stat-grid { grid-template-columns: 1fr; }
  }

  /* Need-profile bars (county-level, non-PHI) */
  .bar-row { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border-subtle); }
  .bar-row:last-child { border-bottom:none; }
  .bar-row .t { font-size:13px; color:var(--text-body); width:104px; flex:none; }
  .bar { flex:1; height:8px; border-radius:var(--radius-pill); background:var(--slate-100); overflow:hidden; }
  .bar > span { display:block; height:100%; border-radius:var(--radius-pill); }
  .bar-row .v { font-size:13px; font-weight:600; color:var(--text-strong); width:34px; text-align:right; }

  .axis text { fill:var(--slate-500); font-size:10px; font-family:var(--font-mono); }
  .axis path, .axis line { stroke:var(--slate-300); }
  .focusable:focus { outline:none; }
  .focusable:focus-visible { outline:2px solid var(--signal-600); outline-offset:1px; }
  .region-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11px; color:var(--text-muted); }
  .region-legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  .tt { position:fixed; pointer-events:none; opacity:0; transition:opacity 120ms var(--ease-out); background:var(--slate-900); color:#fff; font-size:12px; padding:8px 10px; border-radius:var(--radius-md); box-shadow:var(--shadow-lg); max-width:270px; z-index:60; line-height:1.45; }
  .tt b { color:#fff; } .tt .src { color:var(--slate-400); }
  .empty { padding:60px; text-align:center; color:var(--text-muted); }

  /* Login (auth mode) */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-app); padding:20px; }
  .login-card { width:100%; max-width:360px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-lg); padding:28px; display:flex; flex-direction:column; gap:12px; }
  .login-brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; color:var(--text-strong); }
  .login-brand .mark { width:24px; height:24px; border-radius:6px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .login-card h2 { font-size:18px; color:var(--text-strong); margin:4px 0 4px; }
  .login-card input { height:40px; padding:0 12px; border:1px solid var(--border-default); border-radius:var(--radius-md); font-family:var(--font-sans); font-size:14px; color:var(--text-strong); }
  .login-card input:focus { outline:none; box-shadow:var(--ring-focus); border-color:var(--border-focus); }
  .login-card button[type=submit] { height:40px; border:0; border-radius:var(--radius-md); background:var(--signal-600); color:#fff; font-weight:600; font-size:14px; font-family:var(--font-sans); cursor:pointer; transition:var(--transition-control); }
  .login-card button[type=submit]:hover { background:var(--signal-500); }
  .login-err { font-size:13px; color:var(--danger-700); background:var(--danger-50); border-radius:var(--radius-md); padding:8px 10px; }
  .login-alt { font-size:13px; color:var(--text-muted); text-align:center; }
  .login-alt a { color:var(--signal-600); cursor:pointer; }
  .signout { height:32px; padding:0 12px; border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-body); font-family:var(--font-sans); font-size:13px; cursor:pointer; transition:var(--transition-control); }
  .signout:hover { background:var(--surface-sunken); }

  /* Human-in-the-loop review/override (US-022) */
  .rec-action { margin-top:16px; }
  .rec-action .btn { height:30px; padding:0 12px; border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-body); font-family:var(--font-sans); font-size:13px; cursor:pointer; transition:var(--transition-control); }
  .rec-action .btn:hover { background:var(--surface-sunken); }
  .rec-action .btn.primary { background:var(--signal-600); color:#fff; border-color:var(--signal-600); }
  .rec-action textarea { width:100%; box-sizing:border-box; font-family:var(--font-sans); font-size:13px; padding:8px; border:1px solid var(--border-default); border-radius:var(--radius-md); resize:vertical; }

  /* Explainer chatbot */
  .chat-fab { position:fixed; right:22px; bottom:22px; width:52px; height:52px; border-radius:50%; border:0; background:var(--signal-600); color:#fff; box-shadow:var(--shadow-lg); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:70; transition:var(--transition-control); }
  .chat-fab:hover { background:var(--signal-500); }
  .chat-panel { position:fixed; right:22px; bottom:86px; width:360px; max-width:calc(100vw - 32px); height:460px; max-height:calc(100vh - 120px); background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); display:flex; flex-direction:column; overflow:hidden; z-index:70; }
  .chat-head { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border-subtle); font-size:14px; color:var(--text-strong); }
  .chat-head .chat-sub { font-size:12px; color:var(--text-muted); }
  .chat-head .chat-x { margin-left:auto; border:0; background:none; cursor:pointer; color:var(--text-muted); font-size:14px; }
  .chat-body { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .chat-hint { font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .chat-msg { font-size:13px; line-height:1.5; padding:8px 11px; border-radius:var(--radius-md); max-width:88%; white-space:pre-wrap; }
  .chat-msg.user { align-self:flex-end; background:var(--signal-600); color:#fff; }
  .chat-msg.assistant { align-self:flex-start; background:var(--surface-sunken); color:var(--text-body); border:1px solid var(--border-subtle); }
  .chat-msg.error { align-self:flex-start; background:var(--danger-50); color:var(--danger-700); }
  .chat-typing { opacity:.6; }
  .chat-input { display:flex; gap:8px; padding:10px; border-top:1px solid var(--border-subtle); }
  .chat-input input { flex:1; height:36px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-md); font-family:var(--font-sans); font-size:13px; }
  .chat-input input:focus { outline:none; box-shadow:var(--ring-focus); border-color:var(--border-focus); }
  .chat-input button { width:38px; border:0; border-radius:var(--radius-md); background:var(--signal-600); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="root"></div>
<div class="tt" id="tt"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="ds/_ds_bundle.js"></script>
<!-- Deploy-time API base (live mode). No-op locally; ?api= below still wins. -->
<script src="config.js"></script>
<script>
// Runtime config: point the dashboard at a backend without editing code.
//   ?api=http://localhost:8000/api   -> live API mode (chat widget, /api/counties)
//   &auth=1                          -> require sign-in (needs a DB-backed API)
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get("api")) window.CLINIC_ATLAS_API = q.get("api").replace(/\/$/, "");
  if (q.get("auth") === "1") window.CLINIC_ATLAS_AUTH = true;
})();
</script>
<script type="text/babel" data-presets="react">
const NS = window.TriadHealthEngineDesignSystem_0bb088;
const { Icon, StatCard, ProductBadge, Tabs } = NS;

const DOMAINS = [
  { key:"economic",    short:"Economic",    label:"Economic stability",  source:"Census ACS" },
  { key:"education",   short:"Education",   label:"Education access",    source:"Census ACS" },
  { key:"food",        short:"Food/Housing",label:"Neighborhood & food", source:"USDA" },
  { key:"environment", short:"Environment", label:"Environmental burden",source:"EPA EJSCREEN" },
  { key:"access",      short:"Care access", label:"Healthcare access",   source:"HRSA HPSA" },
];
const OUTCOMES = [
  { key:"diabetes", short:"Diabetes" }, { key:"obesity", short:"Obesity" },
  { key:"mhlth", short:"Mental distress" }, { key:"bphigh", short:"High BP" },
];
const MEASURES = [
  { key:"htn_control",     label:"Hypertension controlled",         source:"HRSA UDS", better:"high" },
  { key:"dm_poor",         label:"Diabetes uncontrolled (HbA1c>9%)",source:"HRSA UDS", better:"low" },
  { key:"depr_screen",     label:"Depression screened & follow-up", source:"HRSA UDS", better:"high" },
  { key:"cervical_screen", label:"Cervical cancer screening",       source:"HRSA UDS", better:"high" },
  { key:"child_immun",     label:"Childhood immunization",          source:"HRSA UDS", better:"high" },
];
const ACTIONS = {
  food:"Enroll in SNAP + on-site food pharmacy; refer to mobile-market route.",
  economic:"Connect to 340B med-cost assistance + benefits navigator this week.",
  access:"Arrange NEMT transport + telehealth follow-up to close the care gap.",
  environment:"Warm hand-off to behavioral health; schedule a 2-week check-in.",
  education:"Health-literacy coaching + plain-language care plan.",
};
const REGIONS = ["Northern","Central","Valley","Southwest","Tidewater"];
const REGION_COLOR = { Northern:"#0284c7", Central:"#d97706", Valley:"#059669", Southwest:"#c026d3", Tidewater:"#4f46e5" };

const fmt0 = d3.format(".0f"), fmt1 = d3.format(".1f"), fmtC = d3.format(",");
const sgn = d => d > 0 ? "+" : "";
const judge = w => Math.abs(w) < 1 ? "on par" : (w > 0 ? "worse" : "better");
const glyph = d => Math.abs(d) < 0.5 ? "≈" : (d > 0 ? "▲" : "▼");
const makeDiv = W => d3.scaleLinear().domain([-W,0,W]).range(["#0284c7","#e2e8f0","#dc2626"]).interpolate(d3.interpolateLab).clamp(true);
const onFill  = w => Math.abs(w) > 11 ? "#fff" : "#0f172a";       // text on a colored cell
const divText = w => Math.abs(w) < 1 ? "#94a3b8" : (w > 0 ? "#dc2626" : "#0284c7"); // readable diverging text on white

const tt = document.getElementById("tt");
const showTT = (html,e) => { tt.innerHTML = html; tt.style.opacity = 1; moveTT(e); };
const moveTT = e => { tt.style.left = (e.clientX+14)+"px"; tt.style.top = (e.clientY+14)+"px"; };
const hideTT = () => { tt.style.opacity = 0; };

function aggregateOf(list){
  const mean = f => d3.mean(list, f);
  return {
    dom: Object.fromEntries(DOMAINS.map(D => [D.key, mean(c => c.dom[D.key])])),
    outcomes: Object.fromEntries(OUTCOMES.map(O => [O.key, mean(c => c.outcomes[O.key])])),
    measures: Object.fromEntries(MEASURES.map(m => [m.key, mean(c => c.measures[m.key])])),
    needIndex: mean(c => c.needIndex), hpsaScore: mean(c => c.hpsaScore),
    patients: d3.median(list, c => c.patients), n: list.length,
  };
}

/* ============================ D3 PANELS (light / Signal) ============================ */
function drawRoot(el, ctx){
  const { byId, selectedId, baselineFor } = ctx;
  const c = byId(selectedId), b = baselineFor(c);
  const W=440,H=500,cx=W/2, host=d3.select(el).html("");
  const svg=host.append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%").attr("role","img")
    .attr("aria-label",`Root portrait of ${c.name} versus ${b.label}.`);
  const trunkTopY=H*0.34, trunkBotY=H*0.56, div=makeDiv(22);
  svg.append("line").attr("x1",24).attr("x2",W-24).attr("y1",trunkBotY).attr("y2",trunkBotY).attr("stroke","var(--slate-300)").attr("stroke-dasharray","2 4");
  const branchY=H*0.115;
  const oX=d3.scalePoint().domain(OUTCOMES.map(o=>o.key)).range([cx-150,cx+150]).padding(0.2);
  const oR=d3.scaleSqrt().domain([0,50]).range([7,30]);
  OUTCOMES.forEach(o=>{
    const x=oX(o.key), cv=c.outcomes[o.key]??0, bv=b.outcomes[o.key]??0, w=cv-bv;
    svg.append("path").attr("d",`M${cx},${trunkTopY} C${cx},${(trunkTopY+branchY)/2} ${x},${(trunkTopY+branchY)/2} ${x},${branchY}`).attr("fill","none").attr("stroke","var(--slate-300)").attr("stroke-width",3);
    svg.append("circle").attr("cx",x).attr("cy",branchY).attr("r",oR(bv)).attr("fill","none").attr("stroke","var(--slate-400)").attr("stroke-dasharray","3 3");
    const leaf=svg.append("g");
    leaf.append("circle").attr("cx",x).attr("cy",branchY).attr("r",oR(cv)).attr("fill",div(w)).attr("opacity",.92).attr("stroke","#fff").attr("stroke-width",1.5);
    leaf.append("text").attr("x",x).attr("y",branchY+3).attr("text-anchor","middle").attr("font-size",10).attr("font-weight",700).attr("font-family","var(--font-mono)").attr("fill",onFill(w)).text(fmt0(cv)+"%");
    leaf.append("text").attr("x",x).attr("y",branchY+oR(Math.max(cv,bv))+14).attr("text-anchor","middle").attr("font-size",10.5).attr("fill","var(--slate-600)").text(o.short);
    leaf.append("text").attr("x",x).attr("y",branchY+oR(Math.max(cv,bv))+27).attr("text-anchor","middle").attr("font-size",10).attr("font-weight",700).attr("font-family","var(--font-mono)").attr("fill",divText(w)).text(glyph(w)+" "+sgn(w)+fmt1(w));
    leaf.on("mouseover",e=>showTT(`<b>${o.short}</b> · CDC PLACES<br>county ${fmt1(cv)}% · ${b.label} ${fmt1(bv)}%<br><b style="color:${divText(w)}">${glyph(w)} ${sgn(w)}${fmt1(w)} pts — ${judge(w)}</b>`,e)).on("mousemove",moveTT).on("mouseout",hideTT);
  });
  svg.append("path").attr("d",`M${cx-12},${trunkBotY} L${cx-6},${trunkTopY} L${cx+6},${trunkTopY} L${cx+12},${trunkBotY} Z`).attr("fill","#b08968");
  const weight=d3.scaleLinear().domain([0,100]).range([4,30]);
  const tipX=d3.scalePoint().domain(DOMAINS.map(D=>D.key)).range([42,W-42]).padding(0.1);

    const x=tipX(D.key), tipY=H-58, cv=c.dom[D.key], bv=b.dom[D.key], w=cv-bv;
    const cpath=`M${cx},${trunkBotY-2} C${cx},${trunkBotY+64} ${x},${trunkBotY+34} ${x},${tipY}`;

    const g=svg.append("g");
    g.append("path").attr("d",cpath).attr("fill","none").attr("stroke",div(w)).attr("stroke-width",weight(cv)).attr("stroke-linecap","round").attr("opacity",.95);
    g.append("circle").attr("cx",x).attr("cy",tipY).attr("r",3.5).attr("fill",div(w));
    g.append("text").attr("x",x).attr("y",tipY+16).attr("text-anchor","middle").attr("font-size",10.5).attr("fill","var(--slate-600)").text(D.short);
    g.append("text").attr("x",x).attr("y",tipY+30).attr("text-anchor","middle").attr("font-size",11).attr("font-weight",700).attr("font-family","var(--font-mono)").attr("fill",divText(w)).text(fmt0(cv)+"  "+glyph(w)+sgn(w)+fmt0(w));
    g.on("mouseover",e=>showTT(`<b>${D.label}</b><br>county burden ${fmt0(cv)} · ${b.label} ${fmt0(bv)}<br><b style="color:${divText(w)}">${glyph(w)} ${sgn(w)}${fmt0(w)} — ${judge(w)}</b><br><span class="src">${D.source}</span>`,e)).on("mousemove",moveTT).on("mouseout",hideTT);
  });
  host.append("div").attr("class","desc").style("margin-top","6px").style("font-size","12px").style("color","var(--text-muted)")
    .html(`Dashed grey = <b>${b.label}</b> baseline shape (n=${b.n}). Solid = ${c.name}. Canopy = outcomes, roots = SDoH burden.`);

function drawHeatmap(el, ctx){
  const { records, selectedId, baselineFor, onSelect, baselineMode } = ctx;
  const host=d3.select(el).html("");
  const dev=c=>{const b=baselineFor(c);return {c,b,d:Object.fromEntries(DOMAINS.map(D=>[D.key,c.dom[D.key]-b.dom[D.key]])),total:d3.sum(DOMAINS,D=>c.dom[D.key]-b.dom[D.key])};};
  const rows=records.map(dev).sort((a,b)=>b.total-a.total), div=makeDiv(22);
  const m={top:46,right:16,bottom:12,left:150}, cellH=22, cellW=80;
  const W=m.left+cellW*DOMAINS.length+m.right, H=m.top+cellH*rows.length+m.bottom;
  // width:100% + viewBox, no fixed height, so the grid fills the box without empty bands.
  const svg=host.append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%").attr("role","img")
    .attr("aria-label",`Deviation heatmap: ${rows.length} counties versus the ${baselineMode==="region"?"region":"all-Virginia"} baseline.`);
  DOMAINS.forEach((D,j)=>{
    svg.append("text").attr("x",m.left+j*cellW+cellW/2).attr("y",m.top-16).attr("text-anchor","middle").attr("font-size",11).attr("font-weight",600).attr("fill","var(--slate-700)").text(D.short);
    svg.append("text").attr("x",m.left+j*cellW+cellW/2).attr("y",m.top-4).attr("text-anchor","middle").attr("font-size",9).attr("fill","var(--slate-400)").text(D.source.split(" ")[0]);
  });
  rows.forEach((row,i)=>{
    const c=row.c, selected=c.id===selectedId;
    const ranked=DOMAINS.map(D=>({k:D.key,v:c.dom[D.key]})).sort((a,b)=>b.v-a.v), rankMap={};
    ranked.slice(0,3).forEach((d,ri)=>rankMap[d.k]=ri+1);
    const g=svg.append("g").attr("transform",`translate(0,${m.top+i*cellH})`).attr("tabindex",0).attr("class","focusable").attr("role","button").style("cursor","pointer")
      .on("click",()=>onSelect(c.id)).on("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSelect(c.id);}});
    if(selected) g.append("rect").attr("x",2).attr("y",0).attr("width",W-4).attr("height",cellH).attr("fill","none").attr("stroke","var(--signal-600)").attr("stroke-width",2).attr("rx",4);
    g.append("text").attr("x",m.left-10).attr("y",cellH/2+4).attr("text-anchor","end").attr("font-size",11).attr("font-weight",selected?700:400).attr("fill",selected?"var(--signal-600)":"var(--slate-700)").text(c.name.length>22?c.name.slice(0,21)+"…":c.name);
    DOMAINS.forEach((D,j)=>{
      const dv=row.d[D.key], tcol=onFill(dv);
      const cell=g.append("g").on("mouseover",e=>showTT(`<b>${c.name}</b><br>${D.short}: burden ${fmt0(c.dom[D.key])} vs ${row.b.label} ${fmt0(row.b.dom[D.key])}<br><b style="color:${divText(dv)}">${glyph(dv)} ${sgn(dv)}${fmt0(dv)} — ${judge(dv)}</b>`+(rankMap[D.key]?`<br>#${rankMap[D.key]} need`:""),e)).on("mousemove",moveTT).on("mouseout",hideTT);
      cell.append("rect").attr("x",m.left+j*cellW+1).attr("y",1).attr("width",cellW-2).attr("height",cellH-2).attr("rx",3).attr("fill",div(dv));
      cell.append("text").attr("x",m.left+j*cellW+cellW/2).attr("y",cellH/2+4).attr("text-anchor","middle").attr("font-size",10.5).attr("font-weight",600).attr("font-family","var(--font-mono)").attr("fill",tcol).text(`${glyph(dv)} ${sgn(dv)}${fmt0(dv)}`);
      if(rankMap[D.key]) cell.append("text").attr("x",m.left+j*cellW+cellW-7).attr("y",10).attr("text-anchor","end").attr("font-size",10).attr("font-weight",800).attr("fill",tcol).text("①②③"[rankMap[D.key]-1]);
    });
  });
}

function drawScatter(el, ctx){

  // Floor the x-domain to a realistic county-population range (stub pop is 0 without a key).
  const maxPop=d3.max(records,c=>c.patients)||0;
  const x=d3.scaleLinear().domain([0,Math.max(maxPop,100000)*1.05]).range([m.left,W-m.right]);

  svg.append("text").attr("x",m.left+8).attr("y",m.top+14).attr("font-size",10.5).attr("fill","var(--danger-700)").attr("font-weight",700).text("Priority: more need, fewer people served");
  svg.append("line").attr("x1",x(xMed)).attr("x2",x(xMed)).attr("y1",m.top).attr("y2",H-m.bottom).attr("stroke","var(--slate-300)").attr("stroke-dasharray","3 3");
  svg.append("line").attr("x1",m.left).attr("x2",W-m.right).attr("y1",y(yMed)).attr("y2",y(yMed)).attr("stroke","var(--slate-300)").attr("stroke-dasharray","3 3");
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${H-m.bottom})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.format("~s")));

  svg.append("text").attr("transform","rotate(-90)").attr("x",-(H/2)).attr("y",13).attr("text-anchor","middle").attr("font-size",11).attr("fill","var(--slate-500)").text("Unmet-need index");
  const r=d3.scaleSqrt().domain([0,26]).range([4,12]);
  svg.append("line").attr("x1",x(c.patients)).attr("y1",y(c.needIndex)).attr("x2",x(xMed)).attr("y2",y(yMed)).attr("stroke","var(--signal-600)").attr("stroke-width",1).attr("stroke-dasharray","4 3").attr("opacity",.7);
  svg.selectAll(".sc-dot").data(set).join("circle").attr("class","focusable sc-dot").attr("tabindex",0).attr("role","button")

    .attr("stroke",d=>d.id===selectedId?"var(--signal-600)":"rgba(15,23,42,.28)").attr("stroke-width",d=>d.id===selectedId?3:1).style("cursor","pointer")
    .on("mouseover",(e,d)=>showTT(`<b>${d.name}</b> · ${d.region}<br>${d.patients?fmtC(d.patients):"—"} people · need ${fmt0(d.needIndex)}<br>HPSA ${d.hpsaScore}/26 <span class="src">· size = HPSA, color = region</span>`,e))
    .on("mousemove",moveTT).on("mouseout",hideTT).on("click",(e,d)=>onSelect(d.id)).on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSelect(d.id);}});
  svg.append("path").attr("d",d3.symbol(d3.symbolDiamond,150)()).attr("transform",`translate(${x(xMed)},${y(yMed)})`).attr("fill","#fff").attr("stroke","var(--slate-900)").attr("stroke-width",1.5)
    .on("mouseover",e=>showTT(`<b>${b.label} average</b><br>${fmtC(Math.round(xMed))} people (median) · need ${fmt0(yMed)}`,e)).on("mousemove",moveTT).on("mouseout",hideTT);

}

function drawGap(el, ctx){
  const { byId, selectedId, baselineFor } = ctx;
  const c=byId(selectedId), b=baselineFor(c), host=d3.select(el).html("");
  const W=980,rowH=46,m={top:22,right:48,bottom:36,left:250}, H=m.top+rowH*MEASURES.length+m.bottom;
  const svg=host.append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%").attr("role","img").attr("aria-label",`Quality gap from ${b.label}.`);
  const x=d3.scaleLinear().domain([0,100]).range([m.left,W-m.right]);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${H-m.bottom})`).call(d3.axisBottom(x).ticks(6).tickFormat(d=>d+"%"));
  svg.append("text").attr("x",(m.left+W-m.right)/2).attr("y",H-4).attr("text-anchor","middle").attr("font-size",11).attr("fill","var(--slate-500)").text("% of eligible patients");
  MEASURES.forEach((mz,i)=>{
    const yc=m.top+i*rowH+rowH/2, cv=c.measures[mz.key], bv=b.measures[mz.key];
    if(cv==null||bv==null) return;
    const w=mz.better==="high"?bv-cv:cv-bv, col=Math.abs(w)<1?"var(--slate-400)":(w>0?"#dc2626":"#0284c7");
    svg.append("text").attr("x",m.left-14).attr("y",yc-2).attr("text-anchor","end").attr("font-size",12.5).attr("fill","var(--slate-800)").text(mz.label);
    svg.append("text").attr("x",m.left-14).attr("y",yc+13).attr("text-anchor","end").attr("font-size",9.5).attr("fill","var(--slate-400)").text(`${mz.source} · ${mz.better==="high"?"higher better":"lower better"}`);
    svg.append("line").attr("x1",x(bv)).attr("x2",x(cv)).attr("y1",yc).attr("y2",yc).attr("stroke",col).attr("stroke-width",3).attr("opacity",.5);
    svg.append("circle").attr("cx",x(bv)).attr("cy",yc).attr("r",6).attr("fill","#fff").attr("stroke","var(--violet-500)").attr("stroke-width",2).on("mouseover",e=>showTT(`<b>${b.label} baseline</b><br>${mz.label}: ${fmt1(bv)}%`,e)).on("mousemove",moveTT).on("mouseout",hideTT);
    svg.append("circle").attr("cx",x(cv)).attr("cy",yc).attr("r",6.5).attr("fill",col).on("mouseover",e=>showTT(`<b>${c.name}</b><br>${mz.label}: ${fmt1(cv)}%<br>${judge(w)} vs ${b.label} (${fmt1(bv)}%)`,e)).on("mousemove",moveTT).on("mouseout",hideTT);
    svg.append("text").attr("x",x(cv)+(cv>=bv?13:-13)).attr("y",yc+4).attr("text-anchor",cv>=bv?"start":"end").attr("font-size",11).attr("font-weight",700).attr("font-family","var(--font-mono)").attr("fill",col).text(glyph(cv-bv)+" "+sgn(cv-bv)+fmt0(cv-bv)+"pt");
  });
  const lg=svg.append("g").attr("transform",`translate(${m.left},${m.top-6})`);
  lg.append("circle").attr("r",5).attr("fill","#fff").attr("stroke","var(--violet-500)").attr("stroke-width",2);
  lg.append("text").attr("x",10).attr("y",4).attr("font-size",10).attr("fill","var(--slate-500)").text("baseline");
  lg.append("circle").attr("cx",78).attr("r",5).attr("fill","#dc2626");
  lg.append("text").attr("x",88).attr("y",4).attr("font-size",10).attr("fill","var(--slate-500)").text("this county");
}

function Login({ apiBase, onAuth }){
  // Sprint demo: prefill the dummy account so the gated site is one-click.
  const [email,setEmail]=React.useState("demo@clinicatlas.dev");
  const [pw,setPw]=React.useState("triad-demo-2026");
  const [mode,setMode]=React.useState("login");
  const [error,setError]=React.useState("");
  const [busy,setBusy]=React.useState(false);
  const submit=async(e)=>{
    e.preventDefault(); setError(""); setBusy(true);
    try{
      const res=await fetch(apiBase+"/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email,password:pw})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.detail||("HTTP "+res.status));
      onAuth(d.token);
    }catch(err){ setError(String(err.message||err)); } finally{ setBusy(false); }
  };
  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-brand"><span className="mark">T</span>Triad · Signal</div>
        <h2>{mode==="login"?"Sign in to the Clinic Needs Atlas":"Create your account"}</h2>
        {mode==="login" && <p className="login-alt">Sprint demo login is prefilled. Just click Sign in.</p>}
        <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus />
        <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} required />
        {error && <div className="login-err">{error}</div>}
        <button type="submit" disabled={busy}>{busy?"…":(mode==="login"?"Sign in":"Create account")}</button>
        <div className="login-alt">
          {mode==="login"?"New here? ":"Have an account? "}
          <a onClick={()=>{setMode(mode==="login"?"register":"login");setError("");}}>
            {mode==="login"?"Create an account":"Sign in"}</a>
        </div>
      </form>
    </div>
  );
}

function ChatWidget({ apiBase, countyId, countyName, token }){
  const [open,setOpen]=React.useState(false);
  const [msgs,setMsgs]=React.useState([]);
  const [input,setInput]=React.useState("");
  const [busy,setBusy]=React.useState(false);
  const bodyRef=React.useRef(null);
  // keep the transcript pinned to the newest message
  React.useEffect(()=>{ const el=bodyRef.current; if(el) el.scrollTop=el.scrollHeight; },[msgs,busy]);
  const send=async(e)=>{
    e.preventDefault();
    const q=input.trim(); if(!q||busy) return;
    setInput(""); setMsgs(m=>[...m,{role:"user",text:q}]); setBusy(true);
    try{
      const res=await fetch(apiBase+"/chat",{method:"POST",
        headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},
        body:JSON.stringify({question:q,county_fips:countyId})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.detail||("HTTP "+res.status));
      setMsgs(m=>[...m,{role:"assistant",text:d.answer||"(no answer)"}]);
    }catch(err){ setMsgs(m=>[...m,{role:"error",text:String(err.message||err)}]); }
    finally{ setBusy(false); }
  };
  return (
    <React.Fragment>
      <button className="chat-fab" onClick={()=>setOpen(o=>!o)} title="Ask about this county" aria-label="Ask the atlas">
        <Icon name={open?"x":"message-circle"} size={20} color="#fff" />
      </button>
      {open && (
        <div className="chat-panel" role="dialog" aria-label="Atlas assistant">
          <div className="chat-head">
            <Icon name="sparkles" size={16} color="var(--signal-600)" /><b>Ask the atlas</b>
            <span className="chat-sub">{countyName}</span>
            <button className="chat-x" onClick={()=>setOpen(false)} aria-label="Close">✕</button>
          </div>
          <div className="chat-body" ref={bodyRef}>
            {msgs.length===0 && <div className="chat-hint">Ask about {countyName}. Try "Why is this county high-need?" Answers use only this dashboard's data and flag anything still pending.</div>}
            {msgs.map((m,i)=><div key={i} className={"chat-msg "+m.role}>{m.text}</div>)}
            {busy && <div className="chat-msg assistant chat-typing">…</div>}
          </div>
          <form className="chat-input" onSubmit={send}>
            <input value={input} onChange={e=>setInput(e.target.value)} placeholder={"Ask about "+countyName+"…"} aria-label="Your question" />
            <button type="submit" disabled={busy} aria-label="Send"><Icon name="send" size={16} color="#fff" /></button>
          </form>
        </div>
      )}
    </React.Fragment>
  );
}

// Human-in-the-loop: recommend the top-need intervention, let a provider
// Accept or Override with a note. The atlas informs; the provider decides.
function RecommendedAction({ county, domain, action }){
  const KEY = "atlas_hitl_" + county.id;
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const [state, setState] = React.useState(read);
  const [editing, setEditing] = React.useState(false);
  const [note, setNote] = React.useState("");
  // Re-scope to the selected county whenever it changes.
  React.useEffect(() => { setState(read()); setEditing(false); setNote(""); }, [county.id]);
  const save = next => { setState(next); try { localStorage.setItem(KEY, JSON.stringify(next)); } catch(e){} };
  const status = state.status || "pending";
  const PILL = { pending:["Pending review","var(--text-muted)"], accepted:["Accepted","var(--signal-600)"], overridden:["Overridden","var(--command-600)"] };
  const [pillLabel, pillColor] = PILL[status];
  return (
    <div className="panel rec-action">
      <div className="panel-h"><Icon name="clipboard-check" size={16} color="var(--signal-600)" /><h3>Recommended action</h3>
        <span className="desc">top need · {domain.label}</span></div>
      <div className="panel-body">
        <p style={{margin:"0 0 12px", color:"var(--text-body)"}}>{action}</p>
        <div style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
          <span className="pill" style={{color:pillColor, borderColor:pillColor}} aria-label={"Review status: " + pillLabel}>{pillLabel}</span>
          <button className="btn primary" onClick={()=>save({status:"accepted"})}>Accept</button>
          <button className="btn" onClick={()=>setEditing(true)}>Override</button>
          <span style={{fontSize:12, color:"var(--text-muted)"}}>A provider decides; the atlas only recommends.</span>
        </div>
        {editing && (
          <div style={{marginTop:12}}>
            <textarea aria-label="Override note" rows={3} value={note} onChange={e=>setNote(e.target.value)}
              placeholder="Describe the provider's alternative action…" />
            <div style={{marginTop:8, display:"flex", gap:8}}>
              <button className="btn primary" onClick={()=>{ save({status:"overridden", note}); setEditing(false); }}>Save override</button>
              <button className="btn" onClick={()=>setEditing(false)}>Cancel</button>
            </div>
          </div>
        )}
        {status==="overridden" && state.note && !editing && (
          <p style={{marginTop:12, fontSize:13, color:"var(--text-body)"}}><b>Override note:</b> {state.note}</p>
        )}
      </div>
    </div>
  );
}

// First-run guide: a dismissible "what am I looking at" banner.
function IntroBanner(){
  const [show, setShow] = React.useState(() => {
    try { return localStorage.getItem("atlas_intro_dismissed") !== "1"; } catch(e){ return true; }
  });
  if(!show) return null;
  const dismiss = () => { try { localStorage.setItem("atlas_intro_dismissed", "1"); } catch(e){} setShow(false); };
  return (
    <div className="intro" role="note" aria-label="How to read this dashboard">
      <span className="ico"><Icon name="info" size={18} color="var(--signal-600)" /></span>
      <div>
        <h4>How to read the Clinic Needs Atlas</h4>
        <p>Each Virginia county gets a 0–100 unmet-need score from public SDoH, chronic-disease, and shortage-area data. Pick a county (search top-right or click a chart), compare it to the Virginia or regional baseline, and check the provenance badges for whether each field is live or pending.</p>
      </div>
      <button className="dismiss" onClick={dismiss}>Got it</button>
    </div>
  );
}

// US-019/020: the model's per-patient risk tiers + drivers -- the "who" and "why".
// Renders only when patients carry model scores (static/scored atlas); hidden
// otherwise (e.g. the live API doesn't serve patient rosters yet).
// Prominent county-level model risk: the score (who), a plain-language tier, and
// the SDoH drivers behind it (why). modelRisk = P(county is in VA's top need tier).
function CountyRiskCard({ county }){
  const risk = county.modelRisk;
  if(risk == null) return null;
  const pct = Math.round(risk*100);
  const high = risk >= 0.5;
  const tier = high ? {t:"High need", c:"var(--danger-500)"}
             : risk >= 0.25 ? {t:"Elevated need", c:"var(--command-600)"}
             : {t:"Lower need", c:"var(--slate-500)"};
  const drivers = county.modelRiskDrivers || [];
  return (
    <div className={"county-risk"+(high?" high":"")}>
      <div>
        <span className="cr-label"><Icon name="brain" size={13} /> County model risk</span>
        <div className="cr-scorerow">
          <span className="cr-score">{pct}%</span>
          <span className="risk-tier" style={{color:tier.c, borderColor:tier.c}}>{tier.t}</span>
        </div>
        <div className="cr-sub">Modeled probability this county sits in Virginia's top tier for preventable health need.</div>
      </div>
      {drivers.length > 0 && (
        <div className="cr-why">
          <p className="cr-why-h">Why this county ranks here</p>
          <div>{drivers.map((d,i) => <span key={i} className="risk-chip">{d}</span>)}</div>
        </div>
      )}
    </div>
  );
}

function RiskPanel({ county }){
  const scored = (county.patientsList || []).filter(p => p.risk != null);
  if(!scored.length) return null;
  const ranked = scored.slice().sort((a,b) => (b.risk||0) - (a.risk||0));
  const highN = ranked.filter(p => p.riskTier === "High").length;
  const TIER = { High:"var(--danger-500)", Medium:"var(--command-600)", Low:"var(--slate-500)" };
  return (
    <div className="panel risk-panel">
      <div className="panel-h"><Icon name="user-check" size={16} color="var(--signal-600)" /><h3>At-risk patients</h3>
        <span className="desc">{county.name} · {highN} high-risk of {scored.length} · model-ranked</span></div>
      <div className="panel-body">
        <table className="risk-table">
          <thead><tr><th>Patient</th><th>Risk</th><th>Tier</th><th>Top drivers (why)</th></tr></thead>
          <tbody>
            {ranked.map((p,i) => (
              <tr key={i}>
                <td>{p.name} <span className="risk-sub">· {p.age}</span></td>
                <td className="mono">{Math.round((p.risk||0)*100)}%</td>
                <td><span className="risk-tier" style={{color:TIER[p.riskTier], borderColor:TIER[p.riskTier]}}>{p.riskTier}</span></td>
                <td>{(p.riskDrivers||[]).map((d,j) => <span key={j} className="risk-chip">{d}</span>)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <p className="risk-note">Synthetic non-PHI cohort. Risk is a model estimate for prioritization, reviewable by a provider.</p>
      </div>
    </div>
  );
}

// Header county picker — a searchable combobox that filters as you type and
// selects on click or keyboard. Replaces a native <datalist>, whose exact
// full-string matching made partial searches fail silently.
function CountyCombobox({ records, selectedId, onSelect }){
  const [open,setOpen]=React.useState(false);
  const [query,setQuery]=React.useState("");
  const [active,setActive]=React.useState(0);
  const wrapRef=React.useRef(null);
  const listRef=React.useRef(null);

  const selected=records.find(r=>r.id===selectedId);
  const selectedLabel=selected?`${selected.name} — ${selected.region}`:"";

  const sorted=records.slice().sort((a,b)=>d3.ascending(a.name,b.name));
  const q=query.trim().toLowerCase();
  const opts=q ? sorted.filter(r=>(`${r.name} ${r.region}`).toLowerCase().includes(q)) : sorted;

  // Close on outside click.
  React.useEffect(()=>{
    if(!open) return;
    const onDown=e=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",onDown);
    return ()=>document.removeEventListener("mousedown",onDown);
  },[open]);

  // Keep the active row in view while navigating with the keyboard.
  React.useEffect(()=>{
    if(!open || !listRef.current) return;
    const el=listRef.current.children[active];
    if(el) el.scrollIntoView({block:"nearest"});
  },[active,open]);

  const openList=()=>{ setQuery(""); setActive(0); setOpen(true); };
  const pick=r=>{ if(r) onSelect(r.id); setOpen(false); setQuery(""); };

  const onKeyDown=e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); if(!open){openList();return;} setActive(a=>Math.min(a+1,opts.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setActive(a=>Math.max(a-1,0)); }
    else if(e.key==="Enter"){ e.preventDefault(); if(open) pick(opts[active]); }
    else if(e.key==="Escape"){ e.preventDefault(); setOpen(false); setQuery(""); e.target.blur(); }
  };

  return (
    <div className="county-combo" ref={wrapRef} style={{minWidth:230}}>
      <input className="county-select" placeholder="Search a county…" aria-label="Search county"
        role="combobox" aria-expanded={open}
        value={open?query:selectedLabel}
        onFocus={openList}
        onClick={()=>{ if(!open) openList(); }}
        onChange={e=>{ setQuery(e.target.value); setActive(0); if(!open) setOpen(true); }}
        onKeyDown={onKeyDown} />
      {open && (
        <div className="county-menu" ref={listRef} role="listbox">
          {opts.length ? opts.map((r,i)=>(
            <div key={r.id} role="option" aria-selected={r.id===selectedId}
              className={"county-opt"+(i===active?" active":"")}
              onMouseEnter={()=>setActive(i)}
              onMouseDown={e=>{ e.preventDefault(); pick(r); }}>
              {r.name} <span className="region">— {r.region}</span>
            </div>
          )) : <div className="county-empty">No counties match “{query}”.</div>}
        </div>
      )}
    </div>
  );
}

function App(){
  const [records,setRecords]=React.useState([]);
  const [provenance,setProvenance]=React.useState(null);
  const [selectedId,setSelectedId]=React.useState(null);
  const [baselineMode,setBaselineMode]=React.useState("va");
  const [tab,setTab]=React.useState("profile");
  const [err,setErr]=React.useState(null);
  const [token,setToken]=React.useState(()=>{ try{ return localStorage.getItem("atlas_token")||""; }catch(e){ return ""; } });

  // Auth is opt-in: only when an API base AND the auth flag are configured.
  const API_BASE = window.CLINIC_ATLAS_API || null;
  const AUTH_ON = !!(window.CLINIC_ATLAS_AUTH && API_BASE);

  React.useEffect(()=>{
    if(AUTH_ON && !token) return;   // wait for sign-in
    const DATA_URL = API_BASE ? API_BASE+"/counties" : "data/clinic_atlas.json";
    fetch(DATA_URL, token?{headers:{Authorization:"Bearer "+token}}:{})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
      .then(d=>{
        const recs=d.records||[];
        setRecords(recs); setProvenance(d.provenance);
        // Open on the highest-need county — the most actionable default.
        const top=recs.reduce((a,b)=>((b.needIndex??0)>(a.needIndex??0)?b:a), recs[0]);
        setSelectedId(top&&top.id);
      })
      .catch(e=>setErr("Could not load the atlas data — run `uv run python src/build_dataset.py`. ("+e.message+")"));
  },[token]);

  // Log a usage event when the county changes (authenticated mode only).
  React.useEffect(()=>{
    if(!(AUTH_ON && token && selectedId)) return;
    fetch(API_BASE+"/events",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
      body:JSON.stringify({event_type:"county_view",county_fips:selectedId})}).catch(()=>{});
  },[selectedId,token]);

  const aggVA=React.useMemo(()=>records.length?aggregateOf(records):null,[records]);
  const aggRegion=React.useMemo(()=>{const o={};if(records.length)REGIONS.forEach(r=>o[r]=aggregateOf(records.filter(c=>c.region===r)));return o;},[records]);

  if(AUTH_ON && !token) return <Login apiBase={API_BASE} onAuth={t=>{ try{localStorage.setItem("atlas_token",t);}catch(e){} setToken(t); }} />;
  if(err) return <div className="empty">{err}</div>;
  if(!records.length||!selectedId) return <div className="empty">Loading…</div>;

  const byId=id=>records.find(c=>c.id===id);
  const baselineFor=c=>baselineMode==="region"
    ? Object.assign({},aggRegion[c.region],{label:c.region+" peers",short:c.region})
    : Object.assign({},aggVA,{label:"all Virginia",short:"Virginia"});
  const c=byId(selectedId);
  const ctx={records,selectedId,baselineMode,byId,baselineFor,onSelect:setSelectedId};
  const topDom=DOMAINS.map(D=>({...D,v:c.dom[D.key]})).sort((a,b)=>b.v-a.v)[0];
  const tabs=[{id:"profile",label:"County profile"},{id:"triage",label:"Compare & triage"},{id:"quality",label:"Quality gaps"}];

  return (
    <div className="app">
      <Sidebar />
      <div className="main">
        <div className="topbar">
          <ProductBadge product="signal" />
          <span className="crumb">/ Clinic Needs Atlas</span>
          <CountyCombobox records={records} selectedId={selectedId} onSelect={setSelectedId} />
          <div style={{marginLeft:"auto", display:"flex", gap:8, alignItems:"center"}}>
            <div className="seg" title="Compare this county against all of Virginia, or against its regional peers only.">
              <button className={baselineMode==="va"?"on":""} onClick={()=>setBaselineMode("va")}>All Virginia</button>
              <button className={baselineMode==="region"?"on":""} onClick={()=>setBaselineMode("region")}>Region peers</button>
            </div>
            {AUTH_ON && <button className="signout" onClick={()=>{ try{localStorage.removeItem("atlas_token");}catch(e){} setToken(""); }}>Sign out</button>}
          </div>
        </div>

        <div className="content">
          <IntroBanner />
          <div className="page-head">
            <h1>Clinic needs atlas</h1>
            <p>Where unmet need concentrates across Virginia — federal SDoH, chronic-disease, and shortage-area signals for <b>{c.name}</b>, versus the {baselineFor(c).label} baseline.</p>
          </div>

          <CountyRiskCard county={c} />

          <div className="stat-grid">
            <div className="stat-cell" title="Composite 0–100 score of unmet health need. Higher means more need.">
              <StatCard label="Unmet-need index" value={fmt0(c.needIndex)} unit="/100" accent="signal" icon={<Icon name="gauge" size={18} />} />
            </div>
            <div className="stat-cell" title="HRSA primary-care shortage score, 0–26. Higher means a worse provider shortage.">
              <StatCard label="Primary-care HPSA" value={String(c.hpsaScore)} unit="/26" accent="signal" icon={<Icon name="map-pin" size={18} />} />
            </div>
            <div className="stat-cell" title="Share of adults with diagnosed diabetes (CDC PLACES).">
              <StatCard label="Diabetes prevalence" value={c.outcomes.diabetes!=null?fmt1(c.outcomes.diabetes):"—"} unit="%" accent="signal" icon={<Icon name="activity" size={18} />} />
            </div>
            <div className="stat-cell" title="The SDoH domain carrying this county's highest burden right now.">
              <StatCard label={"Top need · "+topDom.short} value={fmt0(topDom.v)} unit="/100" accent="command" icon={<Icon name="alert-triangle" size={18} />} />
            </div>
          </div>

          <div className="legend-row">
            <Provenance provenance={provenance} />
            <div className="divlegend"><span>vs. baseline:</span><b style={{color:"#0284c7"}}>better</b><span className="scale" /><b style={{color:"#dc2626"}}>worse</b></div>
          </div>

          <div className="tabwrap"><Tabs items={tabs} value={tab} onChange={setTab} /></div>

          {tab==="profile" && (
            <React.Fragment>
              <div className="two-col">
                <Panel icon="git-branch" title="Comparative root portrait" desc="canopy = outcomes · roots = SDoH burden vs baseline">
                  <D3Panel draw={drawRoot} ctx={ctx} />
                </Panel>
                <NeedProfile c={c} baseline={baselineFor(c)} />
              </div>
              <RecommendedAction county={c} domain={topDom} action={ACTIONS[topDom.key]} />
              <RiskPanel county={c} />
            </React.Fragment>
          )}

          {tab==="triage" && (
            <div className="triage-grid">
              <Panel icon="scatter-chart" title="Need vs. population" desc="size = HPSA · color = region · click a dot">
                <D3Panel draw={drawScatter} ctx={ctx} style={{maxWidth:520}} />
                <div className="region-legend" style={{maxWidth:520}}>{REGIONS.map(rg=><span key={rg}><span className="dot" style={{background:REGION_COLOR[rg]}} />{rg}</span>)}</div>
              </Panel>
              <Panel icon="grid-3x3" title="Deviation heatmap" desc="every county vs. baseline · red worse, blue better · click a row" bodyClass="heat-scroll">
                <D3Panel draw={drawHeatmap} ctx={ctx} />
              </Panel>
            </div>
          )}

          {tab==="quality" && (
            <Panel icon="target" title="Quality gap from baseline" desc="UDS clinical measures · ◯ baseline, ● this county">
              <D3Panel draw={drawGap} ctx={ctx} />
            </Panel>
          )}
        </div>
      </div>
      {API_BASE && <ChatWidget apiBase={API_BASE} countyId={selectedId} countyName={c.name} token={token} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

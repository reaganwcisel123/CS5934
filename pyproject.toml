[project]
name = "cs5934-clinic-needs-atlas"
version = "0.1.0"
description = "Catalog-driven data pipeline feeding the Clinic Needs Atlas dashboard, plus the survey email pipeline."
readme = "data_source_catalog/README.md"
requires-python = ">=3.11"

# Core: the catalog -> real data -> dashboard pipeline (src/).
dependencies = [
    "requests>=2.31",   # HTTP calls to CDC Socrata, Census, HRSA, USDA
    "pandas>=2.0",      # tabular transforms and county-level joins
    "PyYAML>=6.0",      # read data_sources.yml + email config.yaml
    "openpyxl>=3.1",    # read the USDA Food Access Atlas .xlsx workbook
]

[project.optional-dependencies]
# Networked Google stages of the survey email pipeline (email_pipeline/).
# Install with:  uv sync --extra email
email = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "gspread>=6.0",
]
# Phase 1 platform: FastAPI backend + Render Postgres. Install: uv sync --extra api
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.1",      # password hashing (Phase 3 auth)
    "pyjwt>=2.9",       # JWT sessions (Phase 3 auth)
    "anthropic>=0.40",  # Claude API for the explainer chatbot (Phase 4)
]
# ML modeling stage (src/model/). Install: uv sync --extra model
model = [
    "scikit-learn>=1.4",
]

[dependency-groups]
# Dev tooling. `uv sync` installs this by default; run checks with `uv run <tool>`.
dev = [
    "import-linter>=2.0",   # enforce the layering/independence contract below
    "pytest>=8.0",          # unit tests for the pure transform logic
]

[tool.pytest.ini_options]
pythonpath = ["."]          # make `import src` work from the repo root
testpaths = ["tests"]

[tool.uv]
# This repo is an application, not a distributable package, so uv should not
# try to build/install the project itself -- only manage its dependencies.
package = false

# --------------------------------------------------------------------------
# Architecture boundaries (see documents/architecture-boundaries.md).
# Enforced with:  uv run lint-imports
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Layered architecture: dependencies point downward"
type = "layers"
layers = [
    "src.api",
    "src.build_dataset",
    "src.model",
    "src.ingestion",
    "src.db",
    "src.transform",
    "src.catalog",
]

[[tool.importlinter.contracts]]
name = "Model may not import orchestration or serving layers"
type = "forbidden"
source_modules = ["src.model"]
forbidden_modules = ["src.build_dataset", "src.api"]

[[tool.importlinter.contracts]]
name = "Transforms are a pure leaf (no internal imports)"
type = "forbidden"
source_modules = ["src.transform"]
forbidden_modules = ["src.catalog", "src.ingestion", "src.build_dataset", "src.db", "src.api"]

[[tool.importlinter.contracts]]
name = "Catalog is the foundation (imports nothing internal)"
type = "forbidden"
source_modules = ["src.catalog"]
forbidden_modules = ["src.transform", "src.ingestion", "src.build_dataset", "src.db", "src.api"]

[[tool.importlinter.contracts]]
name = "Ingestion sources are mutually independent"
type = "independence"
modules = [
    "src.ingestion.cdc_places",
    "src.ingestion.census_acs",
    "src.ingestion.census_pep",
    "src.ingestion.hrsa_hpsa",
    "src.ingestion.usda_food_access",
    "src.ingestion.synthetic_clinical",
    "src.ingestion.stubs",
]

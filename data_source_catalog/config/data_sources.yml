    documentation_url: "https://www.cdc.gov/nwss/about-data.html"
    auth_required: "no"
    api_key_env_var: null
    geographic_granularity:
      - wastewater_treatment_plant
      - county
      - state
    temporal_granularity: weekly
    refresh_cadence: "weekly, generally Friday after CDC review"
    schema_version: "CDC public wastewater schema - verify current columns during ingestion"
    join_keys:
      - wwtp_id
      - county_fips
      - state
    fields_used:
      - wwtp_id
      - county_names
      - state
      - date_start
      - date_end

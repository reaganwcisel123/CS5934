    ingestion_script: src/ingestion/cdc_nwss.py
    last_verified_date: "2026-06-29"
  -
    source_id: cdc_nndss
    source_name: CDC National Notifiable Diseases Surveillance System Tables
    provider: Centers for Disease Control and Prevention
    source_category: public_health_surveillance
    access_method: "Data.CDC.gov Socrata Open Data API / CSV download"
    access_url: "https://data.cdc.gov/NNDSS/NNDSS-Weekly-Data/x9gk-5huc"
    documentation_url: "https://wonder.cdc.gov/nndss.html"
    auth_required: "no"
    api_key_env_var: null
    geographic_granularity:
      - national
      - state
      - territory
    temporal_granularity:
      - weekly_provisional
      - annual_finalized
    refresh_cadence: weekly provisional and annual finalized releases
    schema_version: "Socrata x9gk-5huc; VA + 6 neighbouring jurisdictions, 2022 W1 - 2026 W29 (238 weeks) as of 2026-07-29"
    join_keys:
      - state
      - mmwr_year
      - mmwr_week
      - condition
    fields_used:
      - condition
      - mmwr_year
      - mmwr_week
      - state
      - current_week_cases
      - cumulative_cases
    limitations:
      - Weekly data are provisional and may change.
      - Reporting practices can vary by condition and jurisdiction.
      - "Mostly state-level; may not directly support county-level modeling."
      - "State-keyed only: this source has no county dimension. County figures
        derived from it are allocated downstream, never observed."
      - "The `states` column changes casing partway through the dataset
        (VIRGINIA for 2022-2024, Virginia for 2025+). Filters must be
        case-insensitive or the two most recent years are silently dropped."
      - "m1 (current week) is used; m2 (cumulative year-to-date) is not, because
        it resets each MMWR year and would inject a sawtooth into lag features."
      - "Pulls Virginia plus Maryland, West Virginia, Kentucky, Tennessee, North
        Carolina and DC so threat ranking can corroborate a rise regionally.
        Anything modelling Virginia must filter on jurisdiction first."
      - "Surveillance effort is not separable from incidence: a jurisdiction
        clearing a reporting backlog is indistinguishable from a real rise."
    privacy_classification: public_aggregate
    ingestion_status: sample_pull_successful
    ingestion_script: src/ingestion/cdc_nndss.py
    last_verified_date: "2026-07-28"

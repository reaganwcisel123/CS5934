    refresh_cadence: "daily cache freshness; publisher updates can occur at any time"
    schema_version: "Grants.gov v1 REST API, verified 2026-08-04"
    join_keys:
      - opportunity_id
      - opportunity_number
    fields_used:
      - opportunity_id
      - opportunity_number
      - opportunity_title

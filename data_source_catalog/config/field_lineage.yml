# Field Lineage Catalog
# Every final dataset field should map to one source_id in config/data_sources.yml.

fields:
  -
    final_field: county_fips
    source_id: census_acs_sdoh
    original_field: state + county
    transformation: "Concatenate state and county FIPS codes into 5-digit county_fips."
    required_for_mvp: true
  -
    final_field: county_population_total
    source_id: county_population_estimates
    original_field: POP or population estimate field from selected PEP vintage
    transformation: Filter to selected year and county; rename to county_population_total.
    required_for_mvp: true
  -
    final_field: county_diabetes_prevalence
    source_id: cdc_places
    original_field: PLACES diabetes prevalence measure
    transformation: "Filter to county-level diabetes measure; keep crude or age-adjusted value consistently; rename."
    required_for_mvp: true
  -
    final_field: county_copd_prevalence
    source_id: cdc_places
    original_field: PLACES COPD prevalence measure
    transformation: "Filter to county-level COPD measure; rename."
    required_for_mvp: false
  -
    final_field: wastewater_viral_activity_level
    source_id: cdc_nwss
    original_field: NWSS viral activity / percentile field
    transformation: Map wastewater treatment plant catchments to county where possible; aggregate weekly values.
    required_for_mvp: false
  -
    final_field: state_notifiable_disease_cases_weekly
    source_id: cdc_nndss
    original_field: NNDSS current week cases
    transformation: Filter to selected conditions; aggregate by state and MMWR week.
    required_for_mvp: false
  -
    final_field: primary_care_hpsa_score
    source_id: hrsa_hpsa
    original_field: HPSA score
    transformation: Filter to primary care discipline and active designations; assign score to matching county/area.
    required_for_mvp: true
  -
    final_field: health_center_patient_count
    source_id: hrsa_uds
    original_field: UDS total patients
    transformation: Extract latest annual UDS total patient count by health center or state.
    required_for_mvp: false
  -
    final_field: cms_overall_star_rating
    source_id: cms_quality_stars
    original_field: overall star rating
    transformation: Join facility quality rating by CCN/provider ID; roll up to county if required.
    required_for_mvp: false
  -
    final_field: medicare_utilization_rate
    source_id: cms_medicare_puf
    original_field: service count and beneficiary count
    transformation: "Compute selected utilization rate; suppress or flag missing low-count values."
    required_for_mvp: false
  -
    final_field: mips_quality_score
    source_id: cms_mips_qpp
    original_field: QPP public performance score/measure field
    transformation: Filter to relevant performance year and clinician/group; aggregate to clinic/county as needed.
    required_for_mvp: false
  -
    final_field: poverty_rate
    source_id: census_acs_sdoh
    original_field: ACS poverty variable
    transformation: "Pull ACS 5-year estimate; calculate rate if count fields are used; preserve MOE separately if included."
    required_for_mvp: true
  -
    final_field: uninsured_rate
    source_id: census_acs_sdoh
    original_field: ACS health insurance coverage variable
    transformation: "Pull ACS 5-year estimate; calculate uninsured percentage at county/tract level."
    required_for_mvp: true
  -
    final_field: environmental_burden_percentile
    source_id: epa_ejscreen
    original_field: EJSCREEN environmental percentile indicators
    transformation: Select chosen EJSCREEN indicator(s); aggregate from block group/tract to county where needed.
    required_for_mvp: false
  -
    final_field: hospital_bed_utilization_historical
    source_id: aspr_hospital_capacity
    original_field: inpatient_beds_used / inpatient_beds
    transformation: Compute historical bed utilization for selected weekly period. Mark as historical if using discontinued COVID feed.
    required_for_mvp: false
  -
    final_field: low_income_low_access_flag
    source_id: usda_food_access
    original_field: LI/LA tract flags
    transformation: "Join tract-level food access flags and aggregate to county proportion if final dataset is county-level."
    required_for_mvp: true
  -
    final_field: fair_market_rent_2br
    source_id: hud_housing
    original_field: "2-bedroom FMR"
    transformation: "Pull HUD FMR by county/metro/ZIP and normalize to county-level as needed."
    required_for_mvp: false
  -
    final_field: rural_health_grant_opportunities_count
    source_id: grants_gov
    original_field: search2 opportunity records
    transformation: Filter open opportunities for rural health keywords/agencies; count by state or target service area.
    required_for_mvp: false
  -
    final_field: state_health_alert_indicator
    source_id: state_health_department_feeds
    original_field: "state-specific alert/outbreak feed fields"
    transformation: "Map state-specific feed status to standardized indicator after per-state schema is defined."
    required_for_mvp: false
  -
    final_field: synthetic_preventable_hospitalization_flag
    source_id: synthetic_clinical_dataset
    original_field: preventable_hospitalization_flag
    transformation: "Use only synthetic, non-PHI rows; version generation logic."
    required_for_mvp: true

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

l Health Clinics is drawn as a flowering dogwood, the state flower. The tight center bud counts how many kinds of need a community faces; the open bloom shows how deep each one runs. Hover a bud to see it flower. Click to gather the forest.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"main\">\n  <div class=\"viz-col\">\n  <div class=\"controls\">\n    <div class=\"viewname\" id=\"viewName\">Map view — hover a bud to preview its bloom; click any bud to compare all clinics<\u002Fdiv>\n    <div class=\"ctl-right\" id=\"gridCtls\">\n      <label for=\"sortSel\">Sort by<\u002Flabel>\n      <select id=\"sortSel\">\n        <option value=\"spatial\" selected=\"\">Geography (spatial)<\u002Foption>\n        <option value=\"filled\">Breadth of need (filled circles)<\u002Foption>\n        <option value=\"poverty\">Poverty rate<\u002Foption>\n        <option value=\"uninsured\">Uninsured<\u002Foption>\n        <option value=\"age65\">Age 65+<\u002Foption>\n        <option value=\"disability\">Disability<\u002Foption>\n        <option value=\"noVehicle\">No vehicle<\u002Foption>\n        <option value=\"broadband\">Broadband (lowest first)<\u002Foption>\n        <option value=\"places\">PLACES health burden<\u002Foption>\n        <option value=\"cost\">Cost per visit<\u002Foption>\n      <\u002Fselect>\n      <button class=\"back\" id=\"backBtn\">← Back to map<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stage\">\n    <svg id=\"viz\" viewBox=\"0 0 1000 540\" role=\"img\" aria-label=\"Dogwood forest visualization of Virginia rural health clinics\"><\u002Fsvg>\n    <aside class=\"panel\" id=\"panel\" aria-live=\"polite\">\n      <button class=\"close\" id=\"panelClose\" aria-label=\"Close\">×<\u002Fbutton>\n      <div id=\"panelBody\"><\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <\u002Fdiv><!-- /viz-col -->\n\n  <section class=\"legend\">\n    <div>\n      <h3>Reading the flower<\u002Fh3>\n      <svg id=\"exFlower\" width=\"252\" height=\"356\" viewBox=\"0 0 252 356\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div>\n      <h3>Reading the bud<\u002Fh3>\n      <div class=\"legend-bud\">\n        <svg id=\"legendBud\" width=\"120\" height=\"120\" viewBox=\"-60 -60 120 120\"><\u002Fsvg>\n        <div>\n          <ul class=\"bud-key\">\n            <li data-hl=\"poverty\"><span class=\"num\">1<\u002Fspan>Poverty rate<\u002Fli>\n            <li data-hl=\"uninsured\"><span class=\"num\">2<\u002Fspan>Uninsured<\u002Fli>\n            <li data-hl=\"age65\"><span class=\"num\">3<\u002Fspan>Age 65 and over<\u002Fli>\n            <li data-hl=\"disability\"><span class=\"num\">4<\u002Fspan>Disability<\u002Fli>\n            <li data-hl=\"noVehicle\"><span class=\"num\">5<\u002Fspan>No vehicle<\u002Fli>\n            <li data-hl=\"broadband\"><span class=\"num\">6<\u002Fspan>Broadband <span class=\"inv\">(fills when low)<\u002Fspan><\u002Fli>\n            <li data-hl=\"places\"><span class=\"num\">7<\u002Fspan>PLACES health burden<\u002Fli>\n            <li data-hl=\"cost\"><span class=\"num\">8<\u002Fspan>Cost per visit<\u002Fli>\n          <\u002Ful>\n          <div class=\"fillnote\" data-hl=\"filled\">\n            <span><i class=\"dotF\"><\u002Fi>above threshold<\u002Fspan>\n            <span><i class=\"dotU\"><\u002Fi>below threshold<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fdiv><!-- /main -->\n\n  <footer>Synthetic demonstration data. Glyph: <em>Cornus florida<\u002Fem> — four notched bracts around a head of small florets. Thresholds shown in each clinic’s detail panel. <span id=\"loadNote\"><\u002Fspan><\u002Ffooter>\n<\u002Fdiv>\n\n<script>\n(async function(){\n'use strict';\n/* ---------- data ---------- */\nconst TOWNS = [\n [\"Jonesville\",36.69,-83.11],[\"Pennington Gap\",36.76,-83.03],[\"Big Stone Gap\",36.88,-82.78],\n [\"Clintwood\",37.15,-82.46],[\"Grundy\",37.28,-82.10],[\"Lebanon\",36.90,-82.08],\n [\"Tazewell\",37.13,-81.52],[\"Marion\",36.84,-81.51],[\"Independence\",36.62,-81.15],\n [\"Hillsville\",36.76,-80.73],[\"Stuart\",36.64,-80.27],[\"Rocky Mount\",36.99,-79.89],\n [\"Chatham\",36.83,-79.40],[\"South Boston\",36.70,-78.90],[\"Farmville\",37.30,-78.39],\n [\"Victoria\",36.99,-78.23],[\"South Hill\",36.73,-78.13],[\"Emporia\",36.69,-77.54],\n [\"Wakefield\",36.97,-76.99],[\"Franklin\",36.68,-76.92],[\"Onancock\",37.71,-75.75],\n [\"Exmore\",37.53,-75.82],[\"Kilmarnock\",37.71,-76.38],[\"Tappahannock\",37.92,-76.86],\n [\"Warsaw\",37.96,-76.76],[\"Bowling Green\",38.05,-77.35],[\"Louisa\",38.02,-78.00],\n [\"Luray\",38.66,-78.46],[\"Woodstock\",38.88,-78.51],[\"Monterey\",38.41,-79.58]\n];\nfunction mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst DOM = {poverty:[8,30],uninsured:[6,20],age65:[14,32],disability:[10,28],noVehicle:[3,15],broadband:[55,92],places:[20,85],cost:[110,240]};\nconst norm=(k,v)=>clamp((v-DOM[k][0])/(DOM[k][1]-DOM[k][0]),0,1);\nconst THR = {poverty:18,uninsured:12,age65:22,disability:20,noVehicle:8,broadband:70,places:60,cost:180};\nconst clinics = TOWNS.map(([name,lat,lon],i)=>{\n  const rnd = mulberry32(1000+i*2654435761);\n  const j=()=> (rnd()-0.5);\n  let b = 0.22 + 0.58*clamp((-lon-75.5)/8.1,0,1);           // westward gradient\n  if(lon>-76.0) b += 0.18;                                   // Eastern Shore\n  if(lat<37.05 && lon>-79.5 && lon<-76.9) b += 0.14;         // Southside\n  b = clamp(b + j()*0.16, 0.06, 0.95);\n  const v=(k,spread)=>{const x=clamp(b+j()*spread,0,1);return DOM[k][0]+x*(DOM[k][1]-DOM[k][0]);};\n  const poverty=v('poverty',.3), uninsured=v('uninsured',.34), age65=v('age65',.4),\n        disability=v('disability',.3), noVehicle=v('noVehicle',.34);\n  const broadband = DOM.broadband[1] - clamp(b+j()*.3,0,1)*(DOM.broadband[1]-DOM.broadband[0]);\n  const pm = {\n    fairPoor: 12 + clamp(b+j()*.24,0,1)*15,\n    highBP:   28 + clamp(b+j()*.24,0,1)*17,\n    diabetes: 8  + clamp(b+j()*.24,0,1)*9,\n    copd:     5  + clamp(b+j()*.24,0,1)*8\n  };\n  const places = 100*((pm.fairPoor-12)/15 + (pm.highBP-28)/17 + (pm.diabetes-8)/9 + (pm.copd-5)/8)/4;\n  const cost = DOM.cost[0] + clamp(b+j()*.34,0,1)*(DOM.cost[1]-DOM.cost[0]);\n  return {i,name,lat,lon,poverty,uninsured,age65,disability,noVehicle,broadband,places,cost,pm};\n});\nfunction isFilled(c,k){ return k==='broadband' ? c[k] <= THR[k] : c[k] >= THR[k]; }\nconst pct=v=>v.toFixed(1)+'%', usd=v=>'$'+Math.round(v);\nconst VARS = [\n {k:'poverty',label:'Poverty rate',fmt:pct,thr:'≥ 18%'},\n {k:'uninsured',label:'Uninsured',fmt:pct,thr:'≥ 12%'},\n {k:'age65',label:'Age 65 and over',fmt:pct,thr:'≥ 22%'},\n {k:'disability',label:'Disability',fmt:pct,thr:'≥ 20%'},\n {k:'noVehicle',label:'No vehicle available',fmt:pct,thr:'≥ 8%'},\n {k:'broadband',label:'Broadband access',fmt:pct,thr:'≤ 70%'},\n {k:'places',label:'PLACES health burden',fmt:v=>Math.round(v)+' / 100',thr:'≥ 60'},\n {k:'cost',label:'Cost per visit',fmt:usd,thr:'≥ $180'}\n];\n/* ---------- glyph geometry ---------- */\nconst BUD_R=2.15, RING_R=5.2, CORE=3.5;\nconst LEN = d3.scaleLinear([0,1],[11,42]);\nconst budPts = [[0,0]].concat(d3.range(7).map(k=>{const a=k*2*Math.PI/7;return [RING_R*Math.cos(a),RING_R*Math.sin(a)];}));\nconst bractW = L => clamp(L*0.88,18,37);\n/* obovate bract: narrow clawed base, widest ~70% out, rounded shoulders, small cleft tip */\nfunction bractPath(L,D){\n  const W=bractW(L), tipY=CORE+L, lob=W*0.13;\n  return `M 0 ${CORE}\n    C ${-W*0.16} ${CORE+L*0.08}, ${-W*0.44} ${CORE+L*0.28}, ${-W*0.50} ${CORE+L*0.60}\n    C ${-W*0.53} ${CORE+L*0.80}, ${-W*0.34} ${CORE+L*0.985}, ${-lob} ${tipY}\n    C ${-W*0.088} ${tipY+L*0.006}, ${-W*0.055} ${tipY-D}, 0 ${tipY-D}\n    C ${W*0.055} ${tipY-D}, ${W*0.088} ${tipY+L*0.006}, ${lob} ${tipY}\n    C ${W*0.34} ${CORE+L*0.985}, ${W*0.53} ${CORE+L*0.80}, ${W*0.50} ${CORE+L*0.60}\n    C ${W*0.44} ${CORE+L*0.28}, ${W*0.16} ${CORE+L*0.08}, 0 ${CORE} Z`;\n}\nfunction notchStain(L,D){\n  const W=bractW(L), tipY=CORE+L, lob=W*0.13;\n  return `M ${-lob} ${tipY} C ${-W*0.088} ${tipY+L*0.006}, ${-W*0.055} ${tipY-D}, 0 ${tipY-D} C ${W*0.055} ${tipY-D}, ${W*0.088} ${tipY+L*0.006}, ${lob} ${tipY}`;\n}\nfunction bractVeins(L,D){\n  const W=bractW(L), tipY=CORE+L;\n  return `M 0 ${CORE+2} L 0 ${tipY-D-1.5}\n    M 0 ${CORE+3} Q ${-W*0.20} ${CORE+L*0.5}, ${-W*0.30} ${CORE+L*0.88}\n    M 0 ${CORE+3} Q ${W*0.20} ${CORE+L*0.5}, ${W*0.30} ${CORE+L*0.88}`;\n}\nfunction axes(c){\n  return {\n    N: norm('poverty',c.poverty),\n    E: norm('uninsured',c.uninsured),\n    S: (norm('age65',c.age65)+norm('disability',c.disability))/2,\n    W: (norm('noVehicle',c.noVehicle)+(1-norm('broadband',c.broadband)))/2\n  };\n}\n/* pink spreads inward from tip: fraction of bract length that is pink = cost */\nfunction pinkStops(sel,id,costN){\n  const f = 0.08 + 0.72*costN, m = 1-f;\n  const mid = d3.interpolateLab('#f6cdd9','#ee8fab')(costN);\n  const tip = d3.interpolateLab('#f2bccd','#e26d94')(costN);\n  const g = sel.append('linearGradient').attr('id',id).attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',1);\n  g.append('stop').attr('offset',0).attr('stop-color','#fcfaf2');\n  g.append('stop').attr('offset',Math.max(0,m-0.14)).attr('stop-color','#fcfaf2');\n  g.append('stop').attr('offset',Math.min(1,m+0.20)).attr('stop-color',mid);\n  g.append('stop').attr('offset',1).attr('stop-color',tip);\n}\nfunction notchDepth(c,L){ return (0.42 - 0.42*norm('places',c.places))*L + 1; }\nclinics.forEach(c=>{ c.ax=axes(c); c.maxL = LEN(Math.max(c.ax.N,c.ax.E,c.ax.S,c.ax.W)); });\nclinics.forEach(c=>{ c.filled = VARS.map(v=>isFilled(c,v.k)); c.filledCount=c.filled.filter(Boolean).length; });\n\n/* ---------- svg scaffolding ---------- */\nconst svg = d3.select('#viz');\nconst defs = svg.append('defs');\nclinics.forEach(c=>pinkStops(defs,'grad'+c.i,norm('cost',c.cost)));\nconst Wv=1000, Hv=540;\nconst gMap = svg.append('g').attr('class','mapLayer');\nconst gFlow = svg.append('g');\n/* Virginia outline */\nlet vaFeature=null;\ntry{\n  const topo = await fetch(window.__resources?.usAtlas ?? 'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r=>r.json());\n  const states = topojson.feature(topo, topo.objects.states);\n  vaFeature = states.features.find(f=>f.id==='51');\n}catch(e){ document.getElementById('loadNote').textContent='(State outline failed to load — check connection.)'; }\nconst proj = d3.geoConicConformal().parallels([38,39.5]).rotate([78.5,0]);\nif(vaFeature) proj.fitExtent([[24,30],[976,516]], vaFeature);\nif(vaFeature){\n  gMap.append('path').attr('d', d3.geoPath(proj)(vaFeature))\n    .attr('fill','#efece2').attr('stroke','#b9b39f').attr('stroke-width',1);\n}\nclinics.forEach(c=>{ const p=proj([c.lon,c.lat]); c.mx=p[0]; c.my=p[1]; });\n\n/* ---------- grid assignment ---------- */\nconst COLS=8, ROWS=4;\nconst GX0=88, GX1=912, GY0=64, GY1=440;\nconst cells = [];\nfor(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++)\n  cells.push({x: GX0+(GX1-GX0)*(COLS===1?0.5:col/(COLS-1)), y: GY0+(GY1-GY0)*(ROWS===1?0.5:r/(ROWS-1))});\nfunction spatialAssign(){\n  const xs=d3.extent(clinics,c=>c.mx), ys=d3.extent(clinics,c=>c.my);\n  const tx=c=>GX0+(GX1-GX0)*(c.mx-xs[0])/(xs[1]-xs[0]);\n  const ty=c=>GY0+(GY1-GY0)*(c.my-ys[0])/(ys[1]-ys[0]);\n  const cost=(c,cell)=>{const dx=tx(c)-cell.x, dy=ty(c)-cell.y; return dx*dx+dy*dy;};\n  // greedy seed\n  const taken=new Array(cells.length).fill(false), asn=new Array(clinics.length);\n  const order=clinics.map((c,i)=>i).sort((a,b)=>clinics[a].mx-clinics[b].mx);\n  for(const i of order){\n    let best=-1,bc=Infinity;\n    cells.forEach((cell,j)=>{ if(!taken[j]){const cst=cost(clinics[i],cell); if(cst<bc){bc=cst;best=j;}}});\n    asn[i]=best; taken[best]=true;\n  }\n  // improve: pair swaps + moves to free cells\n  let improved=true, guard=0;\n  while(improved && guard++<60){\n    improved=false;\n    for(let a=0;a<clinics.length;a++){\n      for(let b=a+1;b<clinics.length;b++){\n        const cur=cost(clinics[a],cells[asn[a]])+cost(clinics[b],cells[asn[b]]);\n        const swp=cost(clinics[a],cells[asn[b]])+cost(clinics[b],cells[asn[a]]);\n        if(swp<cur-1e-6){ const t=asn[a];asn[a]=asn[b];asn[b]=t; improved=true; }\n      }\n      cells.forEach((cell,j)=>{ if(!taken[j] && cost(clinics[a],cell)<cost(clinics[a],cells[asn[a]])-1e-6){ taken[asn[a]]=false; asn[a]=j; taken[j]=true; improved=true; }});\n    }\n  }\n  return asn;\n}\nconst spatialAsn = spatialAssign();\nfunction sortedAsn(key){\n  const idx = clinics.map((c,i)=>i);\n  const val = c => key==='filled'? c.filledCount : c[key];\n  idx.sort((a,b)=> key==='broadband' ? val(clinics[a])-val(clinics[b]) : val(clinics[b])-val(clinics[a]));\n  const asn=new Array(clinics.length);\n  idx.forEach((ci,rank)=>{ asn[ci]=rank; });\n  return asn;\n}\n\n/* ---------- draw flowers ---------- */\nconst ANGLE={N:180,E:-90,S:0,W:90};\nconst flower = gFlow.selectAll('g.clinic').data(clinics).join('g')\n  .attr('class','clinic')\n  .attr('transform',c=>`translate(${c.mx},${c.my})`)\n  .attr('data-screen-label',c=>c.name);\nflower.each(function(c){\n  const g=d3.select(this);\n  const bloom=g.append('g').attr('class','bloom');\n  ['N','E','S','W'].forEach((ax,bi)=>{\n    const L=LEN(c.ax[ax]), D=notchDepth(c,L);\n    const rot=bloom.append('g').attr('transform',`rotate(${ANGLE[ax]})`);\n    const br=rot.append('g').attr('class','bract').attr('transform','scale(0)');\n    br.append('path').attr('d',bractPath(L,D))\n      .attr('fill',`url(#grad${c.i})`)\n      .attr('stroke','#d3a0b2').attr('stroke-width',0.7).attr('stroke-opacity',0.6);\n    br.append('path').attr('d',bractVeins(L,D))\n      .attr('fill','none').attr('stroke','#c98ba1').attr('stroke-width',0.6).attr('stroke-opacity',0.32);\n    br.append('path').attr('d',notchStain(L,D))\n      .attr('fill','none').attr('stroke','#8a4a3e').attr('stroke-width',1.5)\n      .attr('stroke-opacity',0.55).attr('stroke-linecap','round');\n  });\n  const bud=g.append('g').attr('class','bud');\n  bud.append('circle').attr('r',RING_R+BUD_R+0.9).attr('fill','#dfe8cd').attr('stroke','#9db07f').attr('stroke-width',0.6);\n  budPts.forEach((p,pi)=>{\n    bud.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',BUD_R)\n      .attr('fill', c.filled[pi] ? '#3c7a3f' : '#f2f6e8')\n      .attr('stroke','#2c5730').attr('stroke-width',0.75);\n  });\n  g.append('circle').attr('class','hit').attr('r',13).attr('fill','transparent');\n  g.append('text').attr('class','lbl').attr('y',54).attr('text-anchor','middle')\n    .attr('font-size',11.5).attr('font-family','\"Public Sans\",sans-serif').attr('fill','#3d4636')\n    .attr('opacity',0).style('pointer-events','none').text(c.name);\n  g.append('text').attr('class','hoverlbl').attr('y',-(CORE+c.maxL+9)).attr('text-anchor','middle')\n    .attr('font-size',12).attr('font-family','Newsreader,serif').attr('font-style','italic').attr('fill','#232a20')\n    .attr('opacity',0).style('pointer-events','none').text(c.name);\n});\n\n/* ---------- bloom / collapse ---------- */\nfunction bloom(g,scale){\n  g.raise();\n  g.selectAll('.bract').interrupt().transition().duration(520).delay((d,i)=>i*45)\n    .ease(d3.easeBackOut.overshoot(1.35)).attr('transform',`scale(${scale||1})`);\n}\nfunction collapse(g){\n  g.selectAll('.bract').interrupt().transition().duration(340).ease(d3.easeCubicIn).attr('transform','scale(0)');\n}\n\n/* ---------- state & interactions ---------- */\nlet mode='map', animating=false, selected=null, longPressed=false, lpTimer=null;\nconst panel=d3.select('#panel'), gridCtls=document.getElementById('gridCtls');\nconst viewName=d3.select('#viewName');\n\nflower\n  .on('pointerenter',function(e,c){\n    if(mode!=='map'||animating||e.pointerType==='touch') return;\n    const g=d3.select(this); bloom(g,0.8);\n    g.select('.hoverlbl').transition().duration(250).attr('opacity',1);\n  })\n  .on('pointerleave',function(e,c){\n    if(mode!=='map') return;\n    const g=d3.select(this); collapse(g);\n    g.select('.hoverlbl').transition().duration(200).attr('opacity',0);\n  })\n  .on('pointerdown',function(e,c){\n    if(mode!=='map'||e.pointerType!=='touch') return;\n    const g=d3.select(this); longPressed=false;\n    lpTimer=setTimeout(()=>{ longPressed=true; bloom(g,0.8); g.select('.hoverlbl').attr('opacity',1); },420);\n  })\n  .on('pointerup pointercancel',function(e,c){\n    clearTimeout(lpTimer);\n    if(mode==='map'&&longPressed){ const g=d3.select(this); collapse(g); g.select('.hoverlbl').transition().attr('opacity',0); }\n  })\n  .on('click',function(e,c){\n    if(animating) return;\n    if(longPressed){ longPressed=false; return; }\n    if(mode==='map') toGrid();\n    else openPanel(c,this);\n  });\n\nfunction applyAssignment(asn,dur){\n  return flower.transition().duration(dur).ease(d3.easeCubicInOut)\n    .attr('transform',(c,i)=>`translate(${cells[asn[i]].x},${cells[asn[i]].y})`).end();\n}\nasync function toGrid(){\n  animating=true; mode='grid';\n  viewName.text('Grid view — click a flower for detail');\n  gridCtls.classList.add('on');\n  gMap.transition().duration(450).attr('opacity',0);\n  flower.selectAll('.hoverlbl').attr('opacity',0);\n  flower.selectAll('.bract').interrupt().attr('transform','scale(0)');\n  await new Promise(r=>setTimeout(r,250));\n  await applyAssignment(spatialAsn,950).catch(()=>{});\n  flower.each(function(){ bloom(d3.select(this),1); });\n  await new Promise(r=>setTimeout(r,650));\n  flower.select('.lbl').transition().duration(450).attr('opacity',1);\n  document.getElementById('sortSel').value='spatial';\n  highlightLegend('spatial');\n  animating=false;\n}\nasync function toMap(){\n  animating=true; mode='map'; closePanel();\n  viewName.text('Map view — hover a bud to preview its bloom; click any bud to compare all clinics');\n  gridCtls.classList.remove('on');\n  highlightLegend('spatial');\n  flower.select('.lbl').transition().duration(300).attr('opacity',0);\n  flower.each(function(){ collapse(d3.select(this)); });\n  await new Promise(r=>setTimeout(r,380));\n  await flower.transition().duration(950).ease(d3.easeCubicInOut)\n    .attr('transform',c=>`translate(${c.mx},${c.my})`).end().catch(()=>{});\n  gMap.transition().duration(450).attr('opacity',1);\n  animating=false;\n}\ndocument.getElementById('backBtn').addEventListener('click',()=>{ if(!animating) toMap(); });\ndocument.getElementById('sortSel').addEventListener('change',async e=>{\n  if(mode!=='grid'||animating) return;\n  animating=true;\n  const key=e.target.value;\n  highlightLegend(key);\n  const asn = key==='spatial'? spatialAsn : sortedAsn(key);\n  await applyAssignment(asn,900).catch(()=>{});\n  animating=false;\n});\n\n/* ---------- detail panel ---------- */\nfunction openPanel(c,node){\n  selected=c;\n  flower.select('.hit').attr('stroke','none');\n  d3.select(node).select('.hit').attr('stroke','#2c5730').attr('stroke-dasharray','2 3').attr('stroke-width',1);\n  const axRows=[\n    ['Economic deprivation (top)','Poverty '+pct(c.poverty)],\n    ['Uninsured (right)',pct(c.uninsured)],\n    ['Demographic demand (bottom)','65+ '+pct(c.age65)+' · disability '+pct(c.disability)],\n    ['Access (left)','no vehicle '+pct(c.noVehicle)+' · broadband '+pct(c.broadband)]\n  ];\n  const budRows=VARS.map((v,i)=>{\n    const val=v.fmt(c[v.k]), f=c.filled[i];\n    return `<tr><td><span class=\"num\" style=\"display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-size:9.5px;font-weight:600;margin-right:7px;${f?'background:#3c7a3f;color:#fff':'background:#e9f0e4;color:#2c5730;box-shadow:inset 0 0 0 1.2px #2c5730'}\">${i+1}<\u002Fspan>${v.label}<\u002Ftd><td class=\"v ${f?'met':''}\">${val}<\u002Ftd><td class=\"thr\">${v.thr}<\u002Ftd><\u002Ftr>`;\n  }).join('');\n  document.getElementById('panelBody').innerHTML=`\n    <h2>${c.name}<\u002Fh2><p class=\"sub\">Rural Health Clinic · ${c.lat.toFixed(2)}°N, ${(-c.lon).toFixed(2)}°W<\u002Fp>\n    <p class=\"summary\"><strong>${c.filledCount} of 8<\u002Fstrong> need indicators above threshold<\u002Fp>\n    <h4>Bloom — bract axes<\u002Fh4>\n    <table>${axRows.map(r=>`<tr><td>${r[0]}<\u002Ftd><td class=\"v\">${r[1]}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable>\n    <h4>Bud — circles &amp; thresholds<\u002Fh4>\n    <table>${budRows}<\u002Ftable>\n    <h4>PLACES measures (consolidated in notch)<\u002Fh4>\n    <table>\n      <tr><td>Fair or poor health<\u002Ftd><td class=\"v\">${pct(c.pm.fairPoor)}<\u002Ftd><\u002Ftr>\n      <tr><td>High blood pressure<\u002Ftd><td class=\"v\">${pct(c.pm.highBP)}<\u002Ftd><\u002Ftr>\n      <tr><td>Diabetes<\u002Ftd><td class=\"v\">${pct(c.pm.diabetes)}<\u002Ftd><\u002Ftr>\n      <tr><td>COPD<\u002Ftd><td class=\"v\">${pct(c.pm.copd)}<\u002Ftd><\u002Ftr>\n      <tr><td><strong>Composite burden<\u002Fstrong><\u002Ftd><td class=\"v\"><strong>${Math.round(c.places)} / 100<\u002Fstrong><\u002Ftd><\u002Ftr>\n    <\u002Ftable>\n    <h4>Cost<\u002Fh4>\n    <table><tr><td>Average cost per visit<\u002Ftd><td class=\"v\">${usd(c.cost)}<\u002Ftd><\u002Ftr><\u002Ftable>`;\n  panel.classed('open',true);\n}\nfunction closePanel(){ panel.classed('open',false); selected=null; flower.select('.hit').attr('stroke','none'); }\ndocument.getElementById('panelClose').addEventListener('click',closePanel);\n\n/* ---------- legends ---------- */\n(function legendBud(){\n  const s=d3.select('#legendBud'), k=3.4;\n  s.append('circle').attr('r',(RING_R+BUD_R+0.9)*k).attr('fill','#dfe8cd').attr('stroke','#9db07f').attr('stroke-width',1.2);\n  budPts.forEach((p,i)=>{\n    const filled=[0,2,5].includes(i); // illustrative mix\n    s.append('circle').attr('cx',p[0]*k).attr('cy',p[1]*k).attr('r',BUD_R*k)\n      .attr('fill',filled?'#3c7a3f':'#e9f0e4').attr('stroke','#2c5730').attr('stroke-width',1.4);\n    const lr=(i===0)?0:RING_R*k+16;\n    const a=(i===0)?0:(i-1)*2*Math.PI/7;\n    const nx=(i===0)?0:Math.cos(a)*lr, ny=(i===0)?-16:Math.sin(a)*lr;\n    s.append('text').attr('x',i===0?0:nx).attr('y',(i===0?-14:ny)+3.5).attr('text-anchor','middle')\n      .attr('font-size',10).attr('font-weight',600).attr('fill','#5a6353').text(i+1);\n  });\n})();\n(function exampleFlower(){\n  const s=d3.select('#exFlower');\n  const kd=s.append('defs'); pinkStops(kd,'pkEx',0.62);\n  const cx=130, cy=96, k=1.8;\n  const fl=s.append('g').attr('transform',`translate(${cx},${cy}) scale(${k})`);\n  const EX={N:{L:38,hl:'poverty'},E:{L:27,hl:'uninsured'},S:{L:20,hl:'age65 disability'},W:{L:30,hl:'noVehicle broadband'}};\n  ['N','E','S','W'].forEach(ax=>{\n    const L=EX[ax].L, D=(0.34-0.26*0.5)*L+3;\n    const g=fl.append('g').attr('class','bract-ex').attr('data-hl',EX[ax].hl)\n      .attr('transform',`rotate(${ANGLE[ax]})`);\n    g.append('path').attr('class','body').attr('d',bractPath(L,D))\n      .attr('fill','url(#pkEx)').attr('stroke','#d3a0b2').attr('stroke-width',0.7).attr('stroke-opacity',0.6);\n    g.append('path').attr('d',bractVeins(L,D)).attr('fill','none')\n      .attr('stroke','#c98ba1').attr('stroke-width',0.6).attr('stroke-opacity',0.32);\n    g.append('path').attr('d',notchStain(L,D)).attr('fill','none')\n      .attr('stroke','#8a4a3e').attr('stroke-width',1.5).attr('stroke-opacity',0.55).attr('stroke-linecap','round');\n  });\n  fl.append('circle').attr('r',RING_R+BUD_R+0.9).attr('fill','#dfe8cd').attr('stroke','#9db07f').attr('stroke-width',0.6);\n  budPts.forEach((p,pi)=>fl.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',BUD_R)\n    .attr('fill',[0,2,5].includes(pi)?'#3c7a3f':'#f2f6e8').attr('stroke','#2c5730').attr('stroke-width',0.75));\n  // axis labels at each bract\n  const axLab=(x,y,hl,lines,anchor)=>{\n    const t=s.append('text').attr('x',x).attr('y',y).attr('text-anchor',anchor||'middle').attr('data-hl',hl);\n    lines.forEach((ln,i)=>t.append('tspan').attr('x',x).attr('dy',i?12:0).text(ln));\n    return t;\n  };\n  axLab(cx,cy-k*(CORE+38)-8,'poverty',['Poverty']);\n  axLab(cx,cy+k*(CORE+20)+16,'age65 disability',['65+ · disability']);\n  axLab(cx-k*(CORE+30)-6,cy+3,'noVehicle broadband',['No vehicle ·','broadband'],'end');\n  axLab(cx+k*(CORE+27)+8,cy+4,'uninsured',['Uninsured'],'start');\n  // lettered markers on the flower, matching an annotation list below\n  const CO=[\n    {y:200, hl:'places', tx:'Notch depth', sub:'PLACES burden · heavier = shallower', anchorPt:[cx+9,cy-k*(CORE+38)+8]},\n    {y:244, hl:'', tx:'Bract length', sub:'depth of need on each axis', anchorPt:[cx+k*(CORE+27)*0.75,cy-22]},\n    {y:288, hl:'cost', tx:'Pink extent & depth', sub:'cost per visit · pinker = costlier', anchorPt:[cx+13,cy+k*(CORE+20)*0.72]},\n    {y:332, hl:'filled', tx:'Bud circles', sub:'8 indicators, filled at threshold', anchorPt:[cx+k*(RING_R+BUD_R)+3,cy+7]}\n  ];\n  const LX=14, LETTERS=['a','b','c','d'];\n  const mark=(x,y,ltr)=>{\n    s.append('circle').attr('cx',x).attr('cy',y).attr('r',6.5).attr('fill','#fffdf9').attr('stroke','#2c5730').attr('stroke-width',1);\n    s.append('text').attr('x',x).attr('y',y+3).attr('text-anchor','middle')\n      .attr('font-size',8.5).attr('font-weight',700).attr('fill','#2c5730').text(ltr);\n  };\n  CO.forEach((co,i)=>{\n    mark(co.anchorPt[0],co.anchorPt[1],LETTERS[i]);\n    mark(LX+6,co.y-4,LETTERS[i]);\n    const t=s.append('text').attr('class','strong').attr('x',LX+20).attr('y',co.y).text(co.tx);\n    if(co.hl) t.attr('data-hl',co.hl);\n    s.append('text').attr('x',LX+20).attr('y',co.y+14).text(co.sub);\n  });\n})();\nfunction highlightLegend(key){\n  document.querySelectorAll('[data-hl]').forEach(el=>{\n    el.classList.toggle('hl-on', key!=='spatial' && el.getAttribute('data-hl').split(' ').includes(key));\n  });\n}\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

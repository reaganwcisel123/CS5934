# Render Blueprint: everything under one roof.
#  - clinic-needs-atlas : static dashboard (build step runs the ETL)
#  - clinic-atlas-api   : FastAPI backend reading Render Postgres
#  - clinic-atlas-db    : Render Postgres (the atlas database)
#
# Deploy: in Render, New > Blueprint, connect this repo. Prod tracks `main`.

databases:
  - name: clinic-atlas-db
    databaseName: clinic_atlas
    user: clinic_atlas
    plan: free            # free Postgres expires ~30 days; bump to `basic-256mb`+ for prod

services:
  # Static dashboard (unchanged): built by the ETL at deploy time.
  - type: web
    name: clinic-needs-atlas
    runtime: static
    branch: main
    buildCommand: bash scripts/build-site.sh
    staticPublishPath: ./dashboard
    pullRequestPreviewsEnabled: true
    envVars:
      - key: CENSUS_API_KEY
        sync: false
      # API hostname, written into dashboard/config.js at build so the dashboard
      # boots in live mode (chat widget + DB-served data).
      - key: ATLAS_API_HOST
        fromService:
          type: web
          name: clinic-atlas-api
          property: host
    headers:
      - path: /data/*
        name: Cache-Control
        value: "public, max-age=3600"

  # FastAPI backend: serves /api/* from Render Postgres.
  - type: web
    name: clinic-atlas-api
    runtime: python
    branch: main
    plan: free
    # Install deps, migrate, build + seed, TRAIN the risk models, then score
    # (patients + counties) and load into Postgres. Training runs at build (models
    # are gitignored); the uvicorn runtime never imports sklearn -- build-only dep.
    buildCommand: >-
      pip install uv &&
      uv sync --extra api --extra model --extra grants &&
      uv run python -m src.db.migrate &&
      uv run python src/build_dataset.py --refresh --seed &&
      uv run python -m src.model.train --target both &&
      uv run python src/build_dataset.py --score --to-db
    startCommand: uv run uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-atlas-db
          property: connectionString
      - key: CENSUS_API_KEY
        sync: false
      # Enables the grounded chatbot; without it /api/chat returns 503.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Signs login session tokens (Phase 3 auth).
      - key: JWT_SECRET
        sync: false
  - type: cron
    name: clinic-atlas-grants-refresh
    runtime: python
    branch: main
    schedule: "0 5 * * *"
    buildCommand: pip install uv && uv sync --extra api --extra grants
    startCommand: uv run python -m src.grants.pipeline --daily --refresh --persist
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-atlas-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
